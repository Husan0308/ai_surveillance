detector:
  model: rfdetr-small
  device: cuda:0

  # Exact production profile from agent/rfdetr-s-core-final.
  # Keep the detector conservative: the old working branch used 0.18 and semantic
  # class-name filtering. The 0.06 experiment created furniture/fragment boxes.
  capture_width: 672
  capture_height: 384
  threshold: 0.18
  max_det: 40

  # GTX 1050 Ti / Pascal-safe profile from the old working runtime.
  micro_batch: 1
  gpu_duty: 0.24
  gpu_duty_min: 0.12
  gpu_duty_max: 0.30
  startup_timeout_sec: 90
  result_timeout_sec: 12
  max_result_age_ms: 220
  optimize_for_inference: false

  # No ROI recovery, hard masks, low-confidence births or fragment suppression in
  # the baseline. Those were not part of the proven RF-DETR-S camera-only profile.
  # First reproduce the old correct detector exactly; additions come only after a
  # real-camera A/B test.
  box:
    side_margin: 0.08
    top_margin: 0.04
    bottom_margin: 0.10
    max_age_sec: 1.80
    max_predict_sec: 0.75

    # Exact old SmoothBoxManager motion/update constants.
    association_score_min: 0.12
    velocity_keep: 0.55
    velocity_measure: 0.45
    size_velocity_keep: 0.70
    size_velocity_measure: 0.30
    position_alpha: 0.82
    grow_width_alpha: 0.75
    shrink_width_alpha: 0.28
    grow_height_alpha: 0.78
    shrink_height_alpha: 0.25
    prediction_damping: 0.75
    prediction_size_gain: 0.35

  # Display always wins over detector throughput.
  wall_p95_slow_ms: 72
  wall_p95_fast_ms: 60
