detector:
  model: rfdetr-small
  device: cuda:0

  # High-recall raw detector gate. This is intentionally low: low-confidence
  # person observations may recover an existing visual track, while the stable
  # Byte/Kalman display manager prevents weak one-frame noise from becoming a box.
  capture_width: 768
  capture_height: 432
  threshold: 0.06
  person_class_id: 1

  # GTX 1050 Ti 4GB safety profile. One image per forward pass keeps VRAM spikes
  # bounded while all six NVDEC streams stay independent from detector latency.
  micro_batch: 1
  gpu_duty: 0.30
  gpu_duty_min: 0.12
  gpu_duty_max: 0.45
  startup_timeout_sec: 90
  result_timeout_sec: 12
  optimize_for_inference: false

  # Display-only visual continuity, adapted from the previously stable core-v1
  # Paddle/Byte-style Kalman tracker. Raw RF-DETR boxes are NOT changed and remain
  # available for future NvDCF/geometry.
  box:
    byte_high_conf: 0.22
    byte_low_conf: 0.06
    start_conf: 0.30
    new_track_min_conf: 0.16
    birth_hits: 2

    match_iou: 0.10
    second_match_iou: 0.04
    match_center: 0.75
    second_match_center: 0.52
    low_match_max_age_sec: 0.85

    process_noise: 0.85
    measurement_noise: 0.90
    velocity_damping: 0.96
    max_prediction_shift_boxes: 0.55
    max_prediction_size_ratio: 0.08
    shrink_measure_alpha: 0.28

    duplicate_iou: 0.68
    duplicate_containment: 0.90
    duplicate_center_distance: 0.20

    hold_sec: 1.20
    memory_sec: 3.0
    predict_sec: 0.55

    # Full-body display guard. Head and shoes get extra room, but the rectangle is
    # intentionally tighter than the first RF-DETR prototype.
    side_margin: 0.08
    top_margin: 0.07
    bottom_margin: 0.10
    sitting_extra_side: 0.04
    sitting_extra_bottom: 0.04
    sitting_aspect_threshold: 1.55

  # If display cadence becomes unhealthy, detector work backs off automatically.
  wall_p95_slow_ms: 72
  wall_p95_fast_ms: 60
