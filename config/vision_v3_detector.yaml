detector:
  model: rfdetr-small
  device: cuda:0

  # RF-DETR-S is a 512px-class model. The capture branch preserves the camera's
  # 16:9 scene and RF-DETR performs its own model preprocessing.
  capture_width: 768
  capture_height: 432
  threshold: 0.18
  person_class_id: 1

  # GTX 1050 Ti 4GB safety profile. One image per RF-DETR forward pass avoids
  # OOM spikes while the six NVDEC streams continue independently. Duty is
  # adaptive: display cadence always has priority over detector throughput.
  micro_batch: 1
  gpu_duty: 0.30
  gpu_duty_min: 0.12
  gpu_duty_max: 0.45
  startup_timeout_sec: 90
  result_timeout_sec: 12
  optimize_for_inference: false

  # Protective DISPLAY envelope. Raw RF-DETR boxes remain untouched for future
  # NvDCF/geometry. The visible box is intentionally generous so a tight model
  # box does not clip head, shoes, hands or a seated/crouched body.
  box:
    side_margin: 0.12
    top_margin: 0.10
    bottom_margin: 0.15
    sitting_extra_side: 0.06
    sitting_extra_bottom: 0.05
    sitting_aspect_threshold: 1.55
    duplicate_iou: 0.80
    hold_sec: 1.80
    predict_sec: 0.80
    expand_alpha: 0.90
    shrink_alpha: 0.18
    position_alpha: 0.82
    velocity_alpha: 0.38
    min_width: 12
    min_height: 24

  # If display cadence becomes unhealthy, detector work backs off automatically.
  wall_p95_slow_ms: 72
  wall_p95_fast_ms: 60
