# AI Surveillance configuration (optimized)
ai:
  detector:
    model: models/yolo26n.pt
    conf: 0.18
    device: auto
    imgsz: 640
  ai_fps: 12
  batch_size: 6
  batch_interval_ms: 40
  detection_interval_frames: 1
  face_interval_frames: 6
  face_min_quality: 0
  face_recognition_timeout_sec: 7
  max_people_per_camera: 12
  pose:
    conf: 0.20
    device: auto
    enabled: false
    imgsz: 640
    model: models/yolo26n-pose.pt
  pose_interval_frames: 5   # reduced to lower GPU load while keeping pose
  reid:
    enabled: true
    deep_enabled: false
    device: cuda
    batch_size: 6
    model: osnet_x1_0_market1501
    threshold: 0.85
    min_transition_seconds: 20
  reid_timeout_sec: 15
  tracker:
    match_thresh: 0.35
    new_track_thresh: 0.28
    track_buffer: 60   # keeps tracks stable during temporary occlusions
    track_high_thresh: 0.22
    track_low_thresh: 0.10
    type: bytetrack
alerts:
  sound_enabled: true
  sound_events:
    - intrusion
    - camera_offline
    - overstay
app:
  name: AI Surveillance System
  ui_locked: true
  version: "3.0"
cameras_config: config/cameras.yaml
database:
  busy_timeout_ms: 5000
  sqlite_path: data/surveillance.db
  type: sqlite
  wal: false
enrollment:
  countdown_seconds: 3
  duplicate_check: true
  duplicate_threshold: 0.752
  flash_animation: true
  hot_reload_recognition: true
  images_count: 10
  min_face_quality: 45
  min_face_size_px: 20
  reject_bad_angle: false
  reject_blur: true
  reject_dark: true
  shutter_sound: true
  source: 0
environment:
  device: cuda
  gpu_id: 0
  threads: 2   # reduced CPU thread pool
deepstream:
  enabled: true
  fallback_to_opencv: false   # avoid CPU fallback
  max_decode_streams: 16
events:
  retention_days: 30
  types:
    - person_detected
    - person_recognized
    - unknown_detected
    - camera_offline
    - camera_online
    - enrollment_completed
    - snapshot
    - error
    - intrusion
    - overstay
  ui_limit: 300
face:
  det_size:
    - 320
    - 320
  enabled: false
  min_face_size: 30
  model: buffalo_l
  threshold: 0.4
heatmap:
  blur: true
  collect_when_off: true
  decay: normal
  grid_h: 36
  grid_w: 64
  history_days: 7
  opacity: 0.6
  use_pose_ankle: true
logging:
  backup_count: 5
  dir: logs
  level: INFO
  max_mb: 10
performance:
  camera_thread_per_camera: true
  db_queue_size: 10000
  frame_queue_size: 2
  ui_refresh_fps: 25
person_management:
  allow_unknown_to_employee: true
  delete_embeddings_on_delete: true
security:
  auto_lock_minutes: 15
  login_password: admin
  login_username: admin
  settings_password: admin
storage:
  auto_delete_old: true
  backups_dir: backups
  exports_dir: exports
  max_disk_gb: 500
  models_dir: models
  recording_format: mp4
  recordings_dir: recordings
  recordings_enabled: false
  retention_days: 14
  segment_minutes: 5
  snapshots_dir: snapshots
camera_rooms:
  CAM-01: Xona-A
  CAM-06: Xona-A

# ===== GEMINI AI =====
gemini:
  enabled: true
  model: gemini-2.5-flash
  api_key: ""
  min_face_score: 0.5
  max_calls_per_min: 30
