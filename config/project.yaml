# AI Surveillance configuration (optimized)
ai:
  detector:
    model: models/yolo26m.pt
    # Low-confidence boxes can recover an existing track, but cannot create
    # a new ID until tracker.new_track_thresh is reached.
    conf: 0.05
    iou: 0.45
    max_det: 50
    min_box_width: 3
    min_box_height: 6
    # Observed bottle false box: ~18x34. Small missed person: ~39x56.
    low_conf_size_threshold: 0.22
    low_conf_min_width: 12
    low_conf_min_height: 36
    device: cuda:0
    # GTX 1050 Ti benchmark: YOLO26m recovered 112/120 confirmed-person misses
    # at both requested sizes; 384x640 was substantially faster than 448x800.
    imgsz: [384, 640]
    half: false
  roi_recovery:
    discovery_interval_ms: 2000
    urgent_interval_ms: 1000
    max_task_age_ms: 500
  # Scheduling/prediction cadence target only. Do not interpret this as real
  # per-camera YOLO observations/sec; runtime metrics report that separately.
  ai_fps: 10
  batch_size: 3
  batch_interval_ms: 40
  max_frame_age_ms: 200
  pose:
    conf: 0.20
    device: cpu
    enabled: false
    imgsz: 320
    model: models/yolo26n-pose.pt
    batch_size: 6
    min_crop_width: 28
    min_crop_height: 60
  secondary:
    enabled: true
    queue_size: 36
  reid:
    enabled: true
    deep_enabled: true
    device: cpu
    batch_size: 6
    batch_wait_ms: 5.0
    model: osnet_x0_25
    checkpoint: models/osnet_x0_25_market1501.pt
    threshold: 0.85
    ambiguous_threshold: 0.82
    unknown_threshold: 0.78
    unknown_margin: 0.04
    lost_memory_seconds: 4.0
    embedding_refresh_seconds: 10.0
    event_cooldown_seconds: 5.0
    min_crop_height: 45
    min_crop_width: 20
    duplicate_iou: 0.65
    min_transition_seconds: 20
  reid_timeout_sec: 15
  tracker:
    match_thresh: 0.35
    new_track_thresh: 0.28
    new_track_min_width: 12
    new_track_min_height: 36
    new_track_min_area: 432
    new_track_min_aspect_ratio: 0.08
    new_track_max_aspect_ratio: 3.5
    # Legacy frame-count guard; real expiry is additionally bounded by
    # monotonic max_lost_time_ms/min_expiry_misses below.
    track_buffer: 15
    max_lost_time_ms: 1800
    min_expiry_misses: 3
    prediction_horizon_ms: 1800
    # Nominal motion-model cadence only, not measured per-camera YOLO FPS.
    effective_ai_fps: 10
    track_high_thresh: 0.22
    track_low_thresh: 0.05
    min_confirmed_hits: 3
    tentative_buffer: 12
    confirmation_mean_thresh: 0.18
    type: custom_motion_iou
    visible_missing_frames: 18
enrollment:
  duplicate_threshold: 0.752
  images_count: 10
deepstream:
  enabled: true
  decoder_backend: nvv4l2decoder
  # NVIDIA recommends increasing decoder surfaces only when buffer starvation
  # is measured. This is now a runtime tuning knob instead of a code constant.
  decoder_extra_surfaces: 2
  fallback_to_opencv: false
  max_decode_streams: 16
face:
  det_size:
    - 320
    - 320
  enabled: false
  device: cpu
  refresh_seconds: 60
  weak_retry_seconds: 3
  min_face_size: 30
  model: buffalo_l
  threshold: 0.4
heatmap:
  enabled: false
  accumulation_mode: POINT
  grid_width: 160
  grid_height: 90
  kernel_radius: 4
  sigma: 2.0
  sample_interval_ms: 250
  live_decay_enabled: true
  live_decay_half_life_seconds: 30
  max_tracked_keys: 4096
logging:
  backup_count: 5
  dir: logs
  level: INFO
  max_mb: 10
performance:
  opencv_threads: 2
  torch_threads: 4
  torch_interop_threads: 1
identity:
  min_independent_evidence_ms: 500
  initial_evidence_interval_seconds: 0.75
  low_quality_retry_seconds: 3.0
  max_embeddings_per_identity: 20
  max_activity_history: 256
  max_runtime_identities: 2000
  unknown_snapshots:
    max_identities: 500
    retention_days: 7
    min_improvement: 0.10
display:
  fps_cap: 12
  presentation_fps: 12
  prediction_fps: 15
  jpeg_quality: 85
  max_width: 960
  max_height: 540
  fullscreen_max_width: 1280
  fullscreen_max_height: 720
