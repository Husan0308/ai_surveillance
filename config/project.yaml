ai:
  ai_fps: 10
  detection_interval_frames: 2
  detector:
    conf: 0.15
    device: auto
    imgsz: 640
    model: models/yolo26n.pt
  face:
    det_size: 640
    enabled: true
    match_threshold: 0.56
    min_face_size_px: 20
    model: buffalo_l
    provider: insightface
  face_interval_frames: 4
  face_min_quality: 0
  face_recognition_timeout_sec: 7
  max_people_per_camera: 20
  pose:
    conf: 0.15
    enabled: true
    imgsz: 640
    model: models/yolo26n-pose.pt
  pose_interval_frames: 3
  reid:
    enabled: true
    model: osnet_x1_0_market1501
    threshold: 0.75
    min_transition_seconds: 20
  reid_timeout_sec: 15
  tracker:
    match_thresh: 0.25
    new_track_thresh: 0.2
    track_buffer: 60
    track_high_thresh: 0.25
    track_low_thresh: 0.1
    type: bytetrack
alerts:
  sound_enabled: true
  sound_events:
  - intrusion
  - camera_offline
  - overstay
  - error
app:
  name: AI Surveillance System
  ui_locked: true
  version: '3.0'
cameras_config: config/cameras.yaml
database:
  busy_timeout_ms: 5000
  sqlite_path: data/surveillance.db
  type: sqlite
  wal: false
enrollment:
  countdown_seconds: 3
  duplicate_check: true
  duplicate_threshold: 0.752
  flash_animation: true
  hot_reload_recognition: true
  images_count: 10
  min_face_quality: 45
  min_face_size_px: 20
  reject_bad_angle: false
  reject_blur: true
  reject_dark: true
  shutter_sound: true
  source: 0
environment:
  device: auto
  gpu_id: 0
  threads: 4
events:
  retention_days: 30
  types:
  - person_detected
  - person_recognized
  - unknown_detected
  - camera_offline
  - camera_online
  - enrollment_completed
  - snapshot
  - error
  - intrusion
  - overstay
  ui_limit: 300
face:
  det_size:
  - 320
  - 320
  enabled: true
  min_face_size: 30
  model: buffalo_l
  threshold: 0.4
heatmap:
  blur: true
  collect_when_off: true
  decay: normal
  grid_h: 36
  grid_w: 64
  history_days: 7
  opacity: 0.6
  use_pose_ankle: true
logging:
  backup_count: 5
  dir: logs
  level: INFO
  max_mb: 10
performance:
  camera_thread_per_camera: true
  db_queue_size: 10000
  frame_queue_size: 2
  ui_refresh_fps: 25
person_management:
  allow_unknown_to_employee: true
  delete_embeddings_on_delete: true
security:
  auto_lock_minutes: 15
  login_password: admin
  login_username: admin
  settings_password: admin
storage:
  auto_delete_old: true
  backups_dir: backups
  exports_dir: exports
  max_disk_gb: 500
  models_dir: models
  recording_format: mp4
  recordings_dir: recordings
  recordings_enabled: false
  retention_days: 14
  segment_minutes: 5
  snapshots_dir: snapshots
camera_rooms:
  CAM-01: Xona-A
  CAM-06: Xona-A

# ===== GEMINI AI =====
gemini:
  enabled: true
  model: gemini-2.5-flash
  api_key: ""
  min_face_score: 0.5
  max_calls_per_min: 30
