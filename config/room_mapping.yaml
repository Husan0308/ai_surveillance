version: 1
coordinate_system: normalized
rooms:
  ROOM-1:
    label: Office 1
    cameras: [CAM-01, CAM-04]
    verified_from: [project_configuration, camera_views]
    overlap_polygon: []
  ROOM-2:
    label: Office 2
    cameras: [CAM-02, CAM-05]
    verified_from: [project_configuration, camera_views]
    overlap_polygon: []
  ROOM-3:
    label: Office 3
    cameras: [CAM-03, CAM-06]
    verified_from: [project_configuration, camera_views]
    overlap_polygon: []

# Geometry deliberately starts uncalibrated. The service never treats a
# screenshot-derived guess as floor-plane ground truth.
calibrations:
  CAM-01: {room_id: ROOM-1, status: uncalibrated, method: none, confidence: 0.0, homography: null, image_size: null, control_points: [], camera_position: null, fov_polygon: []}
  CAM-04: {room_id: ROOM-1, status: uncalibrated, method: none, confidence: 0.0, homography: null, image_size: null, control_points: [], camera_position: null, fov_polygon: []}
  CAM-02: {room_id: ROOM-2, status: uncalibrated, method: none, confidence: 0.0, homography: null, image_size: null, control_points: [], camera_position: null, fov_polygon: []}
  CAM-05: {room_id: ROOM-2, status: uncalibrated, method: none, confidence: 0.0, homography: null, image_size: null, control_points: [], camera_position: null, fov_polygon: []}
  CAM-03: {room_id: ROOM-3, status: uncalibrated, method: none, confidence: 0.0, homography: null, image_size: null, control_points: [], camera_position: null, fov_polygon: []}
  CAM-06: {room_id: ROOM-3, status: uncalibrated, method: none, confidence: 0.0, homography: null, image_size: null, control_points: [], camera_position: null, fov_polygon: []}

calibration:
  preferred_points: 8
  minimum_points: 6
  ransac_threshold_normalized: 0.025
  good_error_normalized: 0.035
  max_outside_margin: 0.08

fusion:
  enabled: true
  reid_weight: 0.72
  position_weight: 0.20
  time_weight: 0.08
  overlap_bonus: 0.06
  maximum_position_distance: 0.28
  impossible_position_distance: 0.48
  simultaneous_window_ms: 450
  debug: false
