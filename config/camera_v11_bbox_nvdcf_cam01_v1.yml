%YAML:1.0
---
BaseConfig:
  minDetectorConfidence: 0.20

TargetManagement:
  enableBboxUnClipping: 0
  preserveStreamUpdateOrder: 1
  maxTargetsPerStream: 24
  # Nested-person step: create a distinct target even when a real second-person
  # detector box overlaps strongly with an existing target. NvMultiObjectTracker
  # only instantiates an unmatched detector object when its maximum IoU to an
  # existing target is below this threshold. Raising 0.65 -> 0.80 is targeted at
  # the fresh nested_unmatched events seen on CAM-01/CAM-02. Do not raise further
  # until duplicate/ghost-track behavior is measured.
  minIouDiff4NewTarget: 0.80
  # Keep partial-occlusion tracks active a little longer. Too-low values can
  # create ghosts, so do not push this below 0.22 without a dedicated test.
  minTrackerConfidence: 0.22
  # Faster late activation for crowded/overlapped people. The previous value 7
  # kept a newly-created real person silent downstream for too many frames; 3
  # still keeps a short validation window without going as aggressive as the
  # NVIDIA NvDCF accuracy profile (probationAge=1).
  probationAge: 3
  # Desk/column occlusion recovery: keep an already-active target in shadow
  # tracking long enough to survive a short full occlusion and re-associate with
  # the same ID when it becomes visible again. NVIDIA's accuracy profile uses a
  # value around 49; use 50 here instead of the previous 18.
  maxShadowTrackingAge: 50
  earlyTerminationAge: 12
  # Export shadow-track misc metadata for overlap diagnostics / recovery. This
  # does not feed enlarged display boxes back into association.
  outputShadowTracks: 1

TrajectoryManagement:
  useUniqueID: 0
  # Motion-only re-association for short full occlusions (desk/column/person).
  # ReID stays disabled in this step so we can isolate whether the existing
  # state-estimator trajectory is enough to restore the original local ID.
  enableReAssoc: 1
  minMatchingScore4Overall: 0.0
  minTrackletMatchingScore: 0.5644
  matchingScoreWeight4TrackletSimilarity: 1.0
  minTrajectoryLength4Projection: 36
  prepLength4TrajectoryProjection: 50
  trajectoryProjectionLength: 94
  maxAngle4TrackletMatching: 106
  minSpeedSimilarity4TrackletMatching: 0.0967
  minBboxSizeSimilarity4TrackletMatching: 0.5577
  maxTrackletMatchingTimeSearchRange: 20
  trajectoryProjectionProcessNoiseScale: 0.0100
  trajectoryProjectionMeasurementNoiseScale: 100.0
  trackletSpacialSearchRegionScale: 0.2598

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 1
  checkClassMatch: 1
  minMatchingScore4Overall: 0.18
  minMatchingScore4SizeSimilarity: 0.30
  minMatchingScore4Iou: 0.05
  minMatchingScore4VisualSimilarity: 0.12
  matchingScoreWeight4VisualSimilarity: 0.45
  matchingScoreWeight4SizeSimilarity: 0.20
  matchingScoreWeight4Iou: 0.35

# Keep the regular KF, but make it respond to the current DCF/detector
# measurements instead of over-smoothing a moving person. The previous
# tracker-noise=8 / velocity-noise=0.10 profile visibly let the person move
# inside an old box before the state caught up.
StateEstimator:
  stateEstimatorType: 2
  processNoiseVar4Loc: 6.0
  processNoiseVar4Size: 4.0
  processNoiseVar4Vel: 1.5
  measurementNoiseVar4Detector: 2.0
  measurementNoiseVar4Tracker: 3.0
  useAspectRatio: 0

# Accuracy-first local tracking profile. Keep the small search region and
# featureImgSizeLevel=2, but add HOG to ColorNames for better discrimination
# when two people overlap or one person is inside another person's bbox.
# This is the only behavior change in this step; feature size stays unchanged
# to limit the extra GPU cost.
VisualTracker:
  visualTrackerType: 1
  useColorNames: 1
  useHog: 1
  featureImgSizeLevel: 2
  featureFocusOffsetFactor_y: 0.0
  filterLr: 0.10
  filterChannelWeightsLr: 0.12
  gaussianSigma: 0.75
  SearchRegionPaddingScale: 1

ReID:
  reidType: 0
