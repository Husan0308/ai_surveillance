%YAML:1.0
---
BaseConfig:
  minDetectorConfidence: 0.20

TargetManagement:
  enableBboxUnClipping: 0
  preserveStreamUpdateOrder: 1
  maxTargetsPerStream: 24
  # Favor a distinct tracker for a real second person even when the new
  # detector box overlaps heavily with an existing person box.  NVIDIA creates
  # a new target when max IoU to existing targets is below this threshold, so a
  # modest increase helps nested/overlapping people without going aggressive.
  minIouDiff4NewTarget: 0.65
  # Keep partial-occlusion tracks active a little longer.  Too-low values can
  # create ghosts, so do not push this below 0.22 without a dedicated test.
  minTrackerConfidence: 0.22
  probationAge: 7
  # Give a temporarily occluded person a few more display frames to recover and
  # re-associate before termination.
  maxShadowTrackingAge: 18
  earlyTerminationAge: 12
  # Export shadow-track misc metadata for overlap diagnostics / recovery.  This
  # does not feed enlarged display boxes back into association.
  outputShadowTracks: 1

TrajectoryManagement:
  useUniqueID: 0
  enableReAssoc: 0

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 1
  checkClassMatch: 1
  minMatchingScore4Overall: 0.18
  minMatchingScore4SizeSimilarity: 0.30
  minMatchingScore4Iou: 0.05
  minMatchingScore4VisualSimilarity: 0.12
  matchingScoreWeight4VisualSimilarity: 0.45
  matchingScoreWeight4SizeSimilarity: 0.20
  matchingScoreWeight4Iou: 0.35

# Keep the regular KF, but make it respond to the current DCF/detector
# measurements instead of over-smoothing a moving person.  The previous
# tracker-noise=8 / velocity-noise=0.10 profile visibly let the person move
# inside an old box before the state caught up.
StateEstimator:
  stateEstimatorType: 2
  processNoiseVar4Loc: 6.0
  processNoiseVar4Size: 4.0
  processNoiseVar4Vel: 1.5
  measurementNoiseVar4Detector: 2.0
  measurementNoiseVar4Tracker: 3.0
  useAspectRatio: 0

# CAM-01 accuracy-first local tracking profile.  Use a smaller search-region
# padding together with a larger feature image so the target occupies more of
# the DCF feature map; this improves per-frame localization instead of drawing
# a padded rectangle around a lagging estimate.
VisualTracker:
  visualTrackerType: 1
  useColorNames: 1
  useHog: 0
  featureImgSizeLevel: 2
  featureFocusOffsetFactor_y: 0.0
  filterLr: 0.10
  filterChannelWeightsLr: 0.12
  gaussianSigma: 0.75
  SearchRegionPaddingScale: 1

ReID:
  reidType: 0
