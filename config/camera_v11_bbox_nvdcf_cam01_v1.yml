%YAML:1.0
---
BaseConfig:
  minDetectorConfidence: 0.20

TargetManagement:
  enableBboxUnClipping: 0
  preserveStreamUpdateOrder: 1
  maxTargetsPerStream: 24
  minIouDiff4NewTarget: 0.55
  minTrackerConfidence: 0.28
  probationAge: 7
  maxShadowTrackingAge: 14
  earlyTerminationAge: 12
  outputShadowTracks: 0

TrajectoryManagement:
  useUniqueID: 0
  enableReAssoc: 0

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 1
  checkClassMatch: 1
  minMatchingScore4Overall: 0.18
  minMatchingScore4SizeSimilarity: 0.30
  minMatchingScore4Iou: 0.05
  minMatchingScore4VisualSimilarity: 0.12
  matchingScoreWeight4VisualSimilarity: 0.45
  matchingScoreWeight4SizeSimilarity: 0.20
  matchingScoreWeight4Iou: 0.35

# CAM-01 body-fit profile.
# Use SIMPLE_BBOX_KF so width/height follow current detector/NvDCF measurements
# instead of extrapolating dw/dh.  This avoids a person moving inside a stale or
# over-tall rectangle while still retaining x/y velocity prediction.
StateEstimator:
  stateEstimatorType: 1
  processNoiseVar4Loc: 6.0
  processNoiseVar4Size: 8.0
  processNoiseVar4Vel: 1.5
  measurementNoiseVar4Detector: 1.5
  measurementNoiseVar4Tracker: 2.0
  useAspectRatio: 0

# Accuracy-first per-frame localization.  HOG captures body/limb shape and is
# important on CAM-01's low-color/IR-like view; ColorNames is retained as an
# additional cue.  A small search region and larger feature map keep more of the
# feature resolution on the actual person rather than background.
VisualTracker:
  visualTrackerType: 1
  useColorNames: 1
  useHog: 1
  useHighPrecisionFeature: 0
  featureImgSizeLevel: 3
  featureFocusOffsetFactor_y: 0.0
  filterLr: 0.11
  filterChannelWeightsLr: 0.14
  gaussianSigma: 0.75
  SearchRegionPaddingScale: 1

ReID:
  reidType: 0
