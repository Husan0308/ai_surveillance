cameras:
  - id: "CAM-01"
    name: "Camera 1"
    location: "Channel 101"
    source: "rtsp://192.168.1.210:554/Streaming/Channels/101"
    ai_source: "rtsp://192.168.1.210:554/Streaming/Channels/101"
    display_source: "rtsp://192.168.1.210:554/Streaming/Channels/101"
    codec: "h264"
    ai_codec: "h264"
    display_codec: "h264"
    latency_ms: 20
    username: "${SURVEILLANCE_RTSP_USERNAME}"
    password: "${SURVEILLANCE_RTSP_PASSWORD}"
    online: true
    ai_enabled: true
    heatmap_enabled: true
    recording_enabled: false
    zone_enabled: false
    overstay_enabled: false
    resolution: "1280x720"
    fps: 25
    reconnect_interval: 10
    connection_timeout: 5
    latency_warn_ms: 200
