deepstream:
  gpu_id: 0
  cudadec_memtype: 0
  rtsp_transport: auto
  # Fallback only; production cameras carry their proven per-camera latency.
  latency_ms: 150
  drop_on_latency: true
  decoder_extra_surfaces: 4
  udp_buffer_size: 1048576
  postdecode_queue_buffers: 1
  capture_timeout_ms: 1200
  startup_grace_sec: 12.0
  reconnect_delay_sec: 2.0
  reconnect_delay_max_sec: 10.0
  startup_stagger_sec: 0.50

detection:
  enabled: true
  model: yolo26m.pt
  device: cuda:0
  # Restored from the old stable detection/smooth-camera baseline. The camera
  # display stays 960x540 while YOLO receives a stride-friendly 736x416 tensor.
  width: 736
  height: 416
  batch_size: 2
  target_fps_per_camera: 4.0
  # Preserve low-score person candidates for ByteTrack stage-2 continuation.
  confidence: 0.08
  iou: 0.50
  max_detections: 30
  half: false
  overlay: true
  overlay_max_age_ms: 900

tracking:
  enabled: true
  track_high_thresh: 0.25
  track_low_thresh: 0.08
  new_track_thresh: 0.25
  track_buffer_seconds: 2.5
  match_thresh: 0.80
  fuse_score: true

display:
  # Proven clear/smooth wall profile from the old sigbus-safe-mmap branch.
  width: 960
  height: 540
  fps: 20
  # Used only by the on-demand diagnostic MJPEG fallback; mmap has no codec.
  jpeg_quality: 88
