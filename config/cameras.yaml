cameras:
  - id: CAM-01
    env_uri: CAM_01_URI
    uri: rtsp://192.168.1.210:554/Streaming/Channels/101
  - id: CAM-02
    env_uri: CAM_02_URI
    uri: rtsp://192.168.1.210:554/Streaming/Channels/201
  - id: CAM-03
    env_uri: CAM_03_URI
    uri: rtsp://192.168.1.210:554/Streaming/Channels/301
  - id: CAM-04
    env_uri: CAM_04_URI
    uri: rtsp://192.168.1.210:554/Streaming/Channels/601
  - id: CAM-05
    env_uri: CAM_05_URI
    uri: rtsp://192.168.1.210:554/Streaming/Channels/502
  - id: CAM-06
    env_uri: CAM_06_URI
    uri: rtsp://192.168.1.210:554/Streaming/Channels/402

deepstream:
  gpu_id: 0
  latency_ms: 150
  drop_on_latency: true
  reconnect_interval_sec: 2
  reconnect_attempts: -1
  decoder_extra_surfaces: 4
  cudadec_memtype: 0
  udp_buffer_size: 1048576
  rtp_protocol: 0

  streammux:
    batch_size: 6
    width: 1280
    height: 720
    live_source: true
    batched_push_timeout_us: 50000
    sync_inputs: false

  frame_transport:
    enabled: true
    directory: /dev/shm/ai_surveillance
    width: 640
    height: 360
    max_fps: 15

  display:
    enabled: false
    rows: 2
    columns: 3
    width: 1920
    height: 1080
