#
# EXPERIMENTAL ONLY — YOLO26m NvDCF retention candidate v5 shadow-lifetime diagnostic.
# This file is intentionally not referenced by the production DeepStream profile.
#
# Fixed detector contract for the staged A/B:
#   YOLO26m FP16, 640x640, confidence 0.25, NMS IoU 0.45, interval 0.
#
# v4 left the CAM-04 1751-1914 association deficit unchanged. Frame audit
# evidence shows four PGIE detections through the blackout, while tracker output
# drops from four to three at frame 1751 and returns to four only when a new
# tentative target appears at frame 1914/1915. The blackout length (~164 frames)
# closely matches maxShadowTrackingAge=162 plus activation delay.
#
# v5 is DIAGNOSTIC ONLY. It keeps all v4 detector-association and identity
# settings fixed and changes one lifecycle variable:
#   maxShadowTrackingAge: 49 -> 49
#
# If the blackout duration contracts to roughly the new shadow lifetime, that
# confirms stale shadow-target lifetime is the dominant mechanism. This is not
# a production recommendation; shorter shadow lifetime may increase ID
# fragmentation after real occlusions.

