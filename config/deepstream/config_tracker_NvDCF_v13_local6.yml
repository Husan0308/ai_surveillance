# Local-only NvDCF profile derived from frozen V13 target-management,
# association, and visual-tracker values. V13's StateEstimator type 3 is an
# SV3DT 3D foot-location estimator and requires calibrated ObjectModelProjection.
# This calibration-free profile uses the replay-validated DeepStream 9.1
# type-2 bbox estimator and public shadow metadata for approved PGIE fallback.
%YAML:1.0

BaseConfig:
  minDetectorConfidence: 0.027087304322979212
  checkClassMatch: 0

TargetManagement:
  enableBboxUnClipping: 1
  preserveStreamUpdateOrder: 0
  maxTargetsPerStream: 200
  minIouDiff4NewTarget: 0.50
  minTrackerConfidence: 0.20
  probationAge: 0
  maxShadowTrackingAge: 162
  earlyTerminationAge: 2
  maxTrajectoryBufferLength: -1
  outputTerminatedTracks: 0
  outputShadowTracks: 1

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 1
  minMatchingScore4Overall: 0.35
  minMatchingScore4SizeSimilarity: 0.30
  minMatchingScore4Iou: 0.10
  minMatchingScore4VisualSimilarity: 0.0520394823204932
  matchingScoreWeight4SizeSimilarity: 0.104589699500018
  matchingScoreWeight4Iou: 0.7844652139368062
  matchingScoreWeight4VisualSimilarity: 0.9294872869302965
  tentativeDetectorConfidence: 0.25
  minMatchingScore4TentativeIou: 0.1768733030811293

StateEstimator:
  stateEstimatorType: 2
  processNoiseVar4Loc: 6810.8668
  processNoiseVar4Size: 1541.8647
  processNoiseVar4Vel: 1348.4874
  measurementNoiseVar4Detector: 100.0000
  measurementNoiseVar4Tracker: 293.3238

VisualTracker:
  visualTrackerType: 2
  useColorNames: 1
  useHog: 1
  featureImgSizeLevel: 5
  featureFocusOffsetFactor_y: -0.10525549278780495
  filterLr: 0.025008995723548734
  filterChannelWeightsLr: 0.09460260509799209
  gaussianSigma: 0.44967391866177786
