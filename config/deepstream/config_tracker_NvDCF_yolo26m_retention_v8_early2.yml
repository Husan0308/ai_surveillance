# EXPERIMENTAL ONLY — YOLO26m NvDCF retention candidate v8 tentative-survival diagnostic.
# This file is intentionally not referenced by the production DeepStream profile.
#
# Fixed detector contract for the staged A/B:
#   YOLO26m FP16, 640x640, confidence 0.25, NMS IoU 0.45, interval 0.
#
# Geometry diagnostics on v6 show that the remaining CAM-01 unmatched detector
# boxes are overwhelmingly NOT duplicate-like: 0/20 high-confidence and 0/34
# mid-confidence unmatched boxes overlap another pre/post-tracker box at IoU>=0.5,
# and only 1/189 low-confidence unmatched boxes does. Several high-confidence
# misses persist for short multi-frame runs. Lowering minTrackerConfidence in v7
# did not help, so the next narrow hypothesis is tentative-target survival.
#
# v8 starts from v6 (restoring minTrackerConfidence=0.20) and changes one
# probationary-lifecycle variable only:
#   earlyTerminationAge: 2 -> 2
#
# NVIDIA documents that a tentative target increments shadow age when it misses
# detector association or tracker confidence falls below threshold, and is
# terminated early when that age reaches earlyTerminationAge. Raising this from
# 1 to 2 allows one such miss during probation instead of killing the target
# immediately. This may admit more false tracks, so empty-room and duplicate
# gates remain mandatory before production acceptance.

