core_v1:
  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  display_fps: 12
  jpeg_quality: 76
  max_display_width: 800
  max_display_height: 450
  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 2.0

  rtsp_transport: "tcp"
  rtsp_latency_ms: 50
  rtsp_buffer_mode: "auto"
  drop_on_latency: false
  tcp_timestamp: true
  decoder_extra_surfaces: 2
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1

  detector:
    enabled: true
    model: "models/yolo26m.pt"
    device: "cuda:0"
    imgsz: [448, 704]
    quantize: 32
    conf: 0.06
    iou: 0.50
    max_det: 50
    batch_size: 3
    poll_interval_ms: 5
    start_delay_sec: 2.0
    duplicate_iou: 0.70
    fusion_containment: 0.90
    fusion_center_distance: 0.30
    overlay_max_age_ms: 300

    # High-resolution recovery is currently enabled only for the difficult
    # entrance camera. Full-frame inference remains active everywhere.
    roi_second_pass:
      enabled: true
      imgsz: [512, 640]
      conf: 0.045
      iou: 0.50
      max_det: 20
      every_n: 2
      trigger_max_full_roi_persons: 1
      cameras:
        CAM-05:
          box: [0.27, 0.00, 0.72, 0.54]

  visual_tracker:
    hold_ms: 1600
    prediction_ms: 450
    memory_ms: 6000
    match_iou: 0.16
    reacquire_distance: 1.05
    duplicate_iou: 0.50
    duplicate_containment: 0.82
    duplicate_center_distance: 0.40

    # Main-room-1, entrance-1 and main-room-2 are the views where one physical
    # person can be represented by a large body box plus a smaller body fragment.
    # This stronger rule is deliberately camera-scoped.
    fragment_duplicate_cameras: ["CAM-03", "CAM-05", "CAM-06"]
    fragment_horizontal_overlap: 0.64
    fragment_x_center: 0.34
    fragment_max_area_ratio: 0.76
    fragment_min_vertical_overlap: 0.08
    fragment_max_vertical_gap: 0.14

    smoothing: 0.72
    start_conf: 0.18
    low_conf_confirm: 0.12

    # CAM-06 has a static sofa/wall-screen area that repeatedly looks like a
    # person to YOLO. This is a presentation/track exclusion, not a detector ROI:
    # the detector still sees the full frame. Only relatively small boxes whose
    # center falls in the known static clutter patch are suppressed.
    exclusion_max_box_height: 0.32
    camera_exclusion_zones:
      CAM-06:
        - [0.44, 0.03, 0.72, 0.43]
