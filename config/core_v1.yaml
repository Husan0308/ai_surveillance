core_v1:
  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  # 15 FPS presentation is still latest-frame-only. No display backlog is built.
  display_fps: 15
  jpeg_quality: 76
  max_display_width: 800
  max_display_height: 450
  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 2.0

  rtsp_transport: "tcp"
  rtsp_latency_ms: 50
  rtsp_buffer_mode: "auto"
  drop_on_latency: false
  tcp_timestamp: true
  decoder_extra_surfaces: 2
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1

  detector:
    enabled: true
    model: "models/yolo26m.pt"
    device: "cuda:0"
    imgsz: [448, 704]
    quantize: 32
    conf: 0.06
    iou: 0.50
    max_det: 50
    batch_size: 3
    poll_interval_ms: 5
    start_delay_sec: 2.0
    duplicate_iou: 0.58
    fusion_containment: 0.84
    fusion_center_distance: 0.40

    # A box may be predicted toward the current display frame only while the
    # detector observation is still recent. Internal track memory is separate.
    overlay_max_age_ms: 650

    # Keep the useful entrance high-resolution verifier. CAM-06's previous
    # rotated sofa ROI was removed because it amplified sofa/TV false positives
    # and added avoidable GPU work/jitter.
    roi_second_pass:
      enabled: true
      imgsz: [512, 640]
      conf: 0.045
      iou: 0.50
      max_det: 20
      every_n: 2
      trigger_max_full_roi_persons: 1
      cameras:
        CAM-05:
          mode: "verify"
          every_n: 1
          always_run: true
          accept_conf: 0.11
          rotations: [0]
          box: [0.27, 0.00, 0.72, 0.54]

  visual_tracker:
    # Visible prediction is intentionally short. Lost-person memory is longer,
    # so occlusion recovery does not require drawing an old ghost rectangle.
    hold_ms: 700
    prediction_ms: 450
    memory_ms: 6000
    match_iou: 0.16
    reacquire_distance: 1.05
    duplicate_iou: 0.50
    duplicate_containment: 0.82
    duplicate_center_distance: 0.40

    fragment_duplicate_cameras: ["CAM-03", "CAM-05", "CAM-06"]
    fragment_horizontal_overlap: 0.64
    fragment_x_center: 0.34
    fragment_max_area_ratio: 0.76
    fragment_min_vertical_overlap: 0.08
    fragment_max_vertical_gap: 0.14

    # Responsive to the newest detector observation while still limiting noisy
    # velocity extrapolation.
    smoothing: 0.96
    velocity_smoothing: 0.70
    max_prediction_shift_boxes: 1.20

    # ByteTrack-style birth policy: low-score detections are allowed to refresh
    # an existing track, but they cannot freely create a new person track.
    start_conf: 0.34
    new_track_min_conf: 0.24
    weak_confirm_hits: 3
    low_conf_confirm: 0.12

    camera_start_conf:
      CAM-05: 0.28
      CAM-06: 0.40

    camera_low_conf_confirm:
      CAM-05: 0.18

    # Static sofa/clutter in main-room-2 needs a stronger score to CREATE a new
    # track. Existing real tracks can still be refreshed by lower-score boxes.
    camera_new_track_zones:
      CAM-06:
        - [0.48, 0.16, 0.72, 0.41, 0.50]

    # Hard restriction only for the physical wall TV. Suppression uses either
    # bbox-center inclusion or sufficient bbox/zone overlap, while the max-height
    # guard keeps a real full-height person near the TV eligible for tracking.
    exclusion_max_box_height: 0.24
    exclusion_overlap_threshold: 0.35
    camera_exclusion_zones:
      CAM-06:
        - [0.58, 0.00, 0.73, 0.18]
