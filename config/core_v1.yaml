core_v1:
  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  # Camera/display baseline. Keep presentation light and latest-only.
  display_fps: 12
  jpeg_quality: 78
  max_display_width: 800
  max_display_height: 450
  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 2.0
  decoder_extra_surfaces: 2
  decoder_low_latency_mode: false
  drop_on_latency: false

  # Stage 2: detector only. No tracking/ReID/identity/prediction/ROI/heatmap.
  detector:
    enabled: true
    model: "models/yolo26m.pt"
    device: "cuda:0"
    imgsz: [384, 640]
    quantize: 32
    conf: 0.18
    iou: 0.45
    max_det: 30
    batch_size: 3
    poll_interval_ms: 5
    start_delay_sec: 2.0
    # Final near-duplicate guard after Ultralytics NMS. High enough to keep two
    # nearby people, low enough to remove two boxes on the same person.
    duplicate_iou: 0.70
    # Raw detector-only stage: never keep a stale bbox around for long.
    overlay_max_age_ms: 250
