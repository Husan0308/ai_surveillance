core_v1:
  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  display_fps: 12
  jpeg_quality: 76
  max_display_width: 800
  max_display_height: 450
  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 2.0

  rtsp_transport: "tcp"
  rtsp_latency_ms: 50
  rtsp_buffer_mode: "auto"
  drop_on_latency: false
  tcp_timestamp: true
  decoder_extra_surfaces: 2
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1

  detector:
    enabled: true
    model: "models/yolo26m.pt"
    device: "cuda:0"
    imgsz: [448, 704]
    quantize: 32
    conf: 0.06
    # Ultralytics documents that lower IoU removes more overlapping detections.
    # YOLO26 end-to-end mode does not use traditional IoU NMS the same way, so
    # our visual layer below remains the final duplicate guard.
    iou: 0.50
    max_det: 50
    batch_size: 3
    poll_interval_ms: 5
    start_delay_sec: 2.0
    duplicate_iou: 0.70
    overlay_max_age_ms: 300

  visual_tracker:
    hold_ms: 1600
    prediction_ms: 450
    memory_ms: 6000
    match_iou: 0.16
    reacquire_distance: 1.05

    # Stronger duplicate suppression than before. This runs both on fresh YOLO
    # results and again on currently visible tracks, so two tracks created on
    # adjacent detector cycles cannot keep drawing two boxes around one person.
    duplicate_iou: 0.50
    duplicate_containment: 0.82
    duplicate_center_distance: 0.40

    smoothing: 0.72
    start_conf: 0.18
    low_conf_confirm: 0.12

    # Ignore only small detections whose center is inside a known static screen.
    # This is deliberately narrow instead of a broad room ROI, so real people
    # walking underneath/near the TV are still eligible for detection.
    exclusion_max_box_height: 0.22
    camera_exclusion_zones:
      CAM-06:
        - [0.48, 0.00, 0.70, 0.18]
