core_v1:
  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  display_fps: 15
  jpeg_quality: 70
  max_display_width: 640
  max_display_height: 360
  publisher_start_stagger_ms: 11
  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 1.0

  capture_backend: "auto"
  max_pipeline_lag_ms: 0
  max_pipeline_lag_samples: 8
  rtsp_transport: "auto"
  rtsp_latency_ms: 150
  rtsp_buffer_mode: "auto"
  drop_on_latency: true
  tcp_timestamp: false
  udp_buffer_size: 1048576
  decoder_extra_surfaces: 4
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1
  deepstream_reconnect_interval_sec: 2
  deepstream_reconnect_attempts: -1

  detector:
    enabled: true
    model: "models/yolo26m.pt"
    device: "cuda:0"
    imgsz: [448, 704]
    quantize: 32
    conf: 0.06
    iou: 0.50
    max_det: 50
    batch_size: 2
    poll_interval_ms: 5
    start_delay_sec: 2.0
    duplicate_iou: 0.58
    fusion_containment: 0.84
    fusion_center_distance: 0.40
    max_submit_age_ms: 300
    max_result_age_ms: 900
    overlay_max_age_ms: 900
    hard_exclusion:
      max_box_height_ratio: 0.30
      overlap_threshold: 0.15
      cameras:
        CAM-06:
          - [0.50, 0.00, 0.78, 0.22]
    roi_second_pass:
      enabled: true
      imgsz: [512, 640]
      conf: 0.045
      iou: 0.50
      max_det: 20
      every_n: 2
      trigger_max_full_roi_persons: 1
      cameras:
        CAM-05:
          mode: "verify"
          every_n: 2
          always_run: false
          accept_conf: 0.11
          rotations: [0]
          trigger_max_full_roi_persons: 1
          box: [0.27, 0.00, 0.72, 0.54]
        CAM-06:
          mode: "augment"
          every_n: 2
          always_run: false
          accept_conf: 0.075
          rotations: [0]
          trigger_max_full_roi_persons: 0
          box: [0.36, 0.12, 0.74, 0.48]

  visual_tracker:
    hold_ms: 800
    memory_ms: 3000
    prediction_ms: 420
    match_iou: 0.12
    reacquire_distance: 0.85
    byte_match_center: 0.70
    byte_second_match_iou: 0.04
    byte_second_match_center: 0.50
    low_match_max_age_ms: 650
    byte_high_conf: 0.24
    byte_low_conf: 0.08
    low_conf_confirm: 0.08
    process_noise: 0.85
    measurement_noise: 0.90
    velocity_damping: 0.96
    size_velocity_damping: 0.60
    max_prediction_shift_boxes: 0.55
    max_prediction_size_ratio: 0.08
    adaptive_error_low: 0.08
    adaptive_error_high: 0.25
    center_response_slow: 0.42
    center_response_fast: 0.88
    size_response: 0.30
    snap_distance_boxes: 0.65
    reversal_damping: 0.15
    duplicate_iou: 0.68
    duplicate_containment: 0.90
    duplicate_center_distance: 0.20
    fragment_duplicate_cameras: ["CAM-03", "CAM-05", "CAM-06"]
    fragment_horizontal_overlap: 0.78
    fragment_x_center: 0.18
    fragment_max_area_ratio: 0.55
    fragment_min_vertical_overlap: 0.20
    fragment_max_vertical_gap: 0.06
    start_conf: 0.34
    new_track_min_conf: 0.24
    strong_confirm_hits: 2
    weak_confirm_hits: 3
    camera_start_conf:
      CAM-05: 0.30
      CAM-06: 0.38
    camera_low_conf_confirm:
      CAM-05: 0.18
    camera_new_track_zones:
      CAM-05:
        - [0.27, 0.00, 0.72, 0.54, 0.38]
      CAM-06:
        - [0.36, 0.12, 0.76, 0.49, 0.42]
    exclusion_max_box_height: 0.30
    exclusion_overlap_threshold: 0.15
    camera_exclusion_zones:
      CAM-06:
        - [0.50, 0.00, 0.78, 0.22]

  # Events and Recent Views are room-level visits, not per-camera detections.
  # The short confirmation window lets same-room ReID pair matching settle first.
  room_sessions:
    enabled: true
    enter_confirm_sec: 0.8
    inactive_timeout_sec: 4.0
    pending_timeout_sec: 2.0
    max_events: 100
    max_recent_sessions: 100

  reid:
    enabled: true
    model: "osnet_ain_x1_0"
    model_path: "models/reid/osnet_ain_x1_0_msmt17.pth"
    model_url: "https://huggingface.co/kaiyangzhou/osnet/resolve/main/osnet_ain_x1_0_msmt17_256x128_amsgrad_ep50_lr0.0015_coslr_b64_fb10_softmax_labsmth_flip_jitter.pth?download=true"
    model_sha256: "8a07e8da38946f7cee37f4561617bf8b6d2fe8f3a4027852893ea092e46d919f"
    device: "cpu"
    torch_cpu_threads: 1
    input_height: 256
    input_width: 128
    flip_tta: true

    poll_interval_ms: 35
    min_track_hits: 2
    local_track_timeout_sec: 3.0
    local_match_iou: 0.10
    local_match_center: 0.82
    embed_cooldown_sec: 0.60
    refresh_sec: 2.0
    quality_improvement: 0.03
    batch_size: 4
    batch_wait_ms: 20
    queue_size: 8
    max_job_age_ms: 800

    tracklet:
      min_samples: 3
      max_samples: 8
      topk: 5
      duplicate_feature_cos: 0.995
      duplicate_quality_gain: 0.025

    crop:
      min_width: 30
      min_height: 64
      min_area: 3000
      min_conf: 0.16
      max_width_height_ratio: 1.10
      edge_margin: 0.010
      reject_edge: false
      min_sharpness: 10.0
      pad_x: 0.05
      pad_y: 0.03

    pair_matching:
      pairs:
        - [CAM-01, CAM-04]
        - [CAM-02, CAM-05]
        - [CAM-03, CAM-06]
      candidate_threshold: 0.54
      strong_threshold: 0.66
      margin: 0.020
      confirm_hits: 2
      strong_confirm_hits: 1
      evidence_ttl_sec: 3.0
      overrides:
        "CAM-01:CAM-04":
          candidate_threshold: 0.54
          strong_threshold: 0.66
          margin: 0.020
        "CAM-02:CAM-05":
          candidate_threshold: 0.54
          strong_threshold: 0.66
          margin: 0.020
        "CAM-03:CAM-06":
          candidate_threshold: 0.54
          strong_threshold: 0.66
          margin: 0.020

    identity:
      prototype_alpha: 0.18
      gallery_size: 12
      active_timeout_sec: 7.0
      historical_match_threshold: 0.56
      historical_strong_threshold: 0.68
      historical_margin: 0.030
      camera_rooms:
        CAM-01: ROOM-1
        CAM-04: ROOM-1
        CAM-02: ROOM-2
        CAM-05: ROOM-2
        CAM-03: ROOM-3
        CAM-06: ROOM-3
      block_concurrent_cross_room: true
