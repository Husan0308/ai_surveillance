core_v1:
  profile: "deepstream-live-sync-heatmap-v5"

  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  # Keep the camera wall sharp while avoiding a JPEG backlog. The source is
  # decoded/scaled by DeepStream; Qt receives only the newest encoded frame.
  display_fps: 18
  jpeg_quality: 90
  max_display_width: 1280
  max_display_height: 720
  publisher_start_stagger_ms: 15

  startup_grace_sec: 8.0
  startup_stagger_sec: 0.18
  capture_timeout_ms: 800
  max_read_timeouts: 3
  reconnect_delay_sec: 1.0

  # This profile is DeepStream/NVDEC-only. No silent OpenCV/GStreamer fallback.
  capture_backend: "deepstream"
  rtsp_transport: "tcp"
  rtsp_latency_ms: 120
  rtsp_buffer_mode: "auto"
  drop_on_latency: true
  tcp_timestamp: false
  udp_buffer_size: 1048576
  decoder_extra_surfaces: 4
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1
  deepstream_reconnect_interval_sec: 2
  deepstream_reconnect_attempts: -1

  # NVIDIA GPU scaling before host copy. 2 = GPU Cubic on dGPU.
  capture_output_width: 1280
  capture_output_height: 720
  capture_interpolation_method: 2
  capture_metrics_interval_sec: 5.0

  # Never let an old camera frame queue grow into visible catch-up latency.
  max_pipeline_lag_ms: 650
  max_pipeline_lag_samples: 10

  detector:
    enabled: true
    model: "yolo26m.pt"
    model_fallback: "yolo26m.pt"
    device: "cuda:0"

    # Restore the old all-camera fresh-batch idea: every inference launch sees
    # the newest frame from all six cameras. Smaller inference canvas lowers
    # wall time; display remains independent at 1280x720.
    imgsz: [320, 576]
    quantize: 32
    classes: [0]
    conf: 0.07
    iou: 0.50
    max_det: 30
    batch_size: 6
    poll_interval_ms: 2
    start_delay_sec: 0.6

    # Freshness is more important than replaying a late result. Tracker bridges
    # the short detector interval and predicts to the display-frame timestamp.
    max_submit_age_ms: 180
    max_result_age_ms: 500
    overlay_max_age_ms: 480

    duplicate_iou: 0.58
    fusion_containment: 0.84
    fusion_center_distance: 0.40

    hard_exclusion:
      max_box_height_ratio: 0.30
      overlap_threshold: 0.15
      cameras: {}

    roi_second_pass:
      enabled: false
      cameras: {}

  # Professional movement/dwell heatmap. A quick pass is blue/cyan; repeated
  # walking or standing in the same area builds green/yellow/red. History fades
  # very slowly (60 minute half-life) instead of disappearing after seconds.
  camera_heatmap:
    enabled: true
    grid_width: 320
    grid_height: 180
    sigma: 5.5
    half_life_sec: 3600.0
    red_seconds: 18.0
    blue_seconds: 0.45
    alpha: 0.42
    render_interval_sec: 0.10
    spatial_blur_sigma: 2.0
    temporal_smoothing_sec: 0.30
    min_confidence_weight: 0.35
    initial_observation_sec: 0.08
    max_observation_sec: 0.45
    max_track_gap_sec: 1.0
    max_jump_ratio: 0.25
    trail_step_sigma: 0.55
    color_map: "jet"

  visual_tracker:
    tracker_type: "bytetrack-hungarian-ownership"
    assignment_solver: "hungarian"
    fuse_score: true

    ownership_lock: true
    ownership_min_hits: 3
    ownership_margin: 0.09
    ownership_low_margin_multiplier: 1.50
    ownership_proximity: 0.70
    ownership_overlap_iou: 0.08
    ownership_iou_advantage: 0.14
    ownership_distance_advantage: 0.14
    ownership_max_competitor_age_ms: 600

    id_namespace_stride: 10000

    # The tracker renders at the newest display-frame timestamp rather than at
    # the older detector timestamp. More responsive measurement correction keeps
    # the corner box visually attached to the person while remaining bounded.
    hold_ms: 650
    memory_ms: 2200
    prediction_ms: 420

    match_iou: 0.12
    reacquire_distance: 0.74
    byte_match_center: 0.64
    byte_second_match_iou: 0.05
    byte_second_match_center: 0.44
    low_match_max_age_ms: 500

    byte_high_conf: 0.24
    byte_low_conf: 0.07
    low_conf_confirm: 0.07
    start_conf: 0.24
    new_track_min_conf: 0.24
    strong_confirm_hits: 2
    weak_confirm_hits: 3

    process_noise: 0.92
    measurement_noise: 0.72
    velocity_damping: 0.94
    size_velocity_damping: 0.60
    max_prediction_shift_boxes: 0.50
    max_prediction_size_ratio: 0.06
    adaptive_error_low: 0.06
    adaptive_error_high: 0.22
    center_response_slow: 0.58
    center_response_fast: 0.94
    size_response: 0.38
    snap_distance_boxes: 0.55
    reversal_damping: 0.12

    duplicate_iou: 0.68
    duplicate_containment: 0.90
    duplicate_center_distance: 0.20
    fragment_duplicate_cameras: []

    camera_start_conf: {}
    camera_low_conf_confirm: {}
    camera_new_track_zones: {}
    exclusion_max_box_height: 0.30
    exclusion_overlap_threshold: 0.15
    camera_exclusion_zones: {}
