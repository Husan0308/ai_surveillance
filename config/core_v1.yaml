core_v1:
  profile: "detection-only-baseline-v1"

  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  # Presentation stays deliberately modest until the six-camera baseline is
  # measured on the real machine. Latest-frame publication prevents backlog.
  display_fps: 15
  jpeg_quality: 72
  max_display_width: 640
  max_display_height: 360
  publisher_start_stagger_ms: 15

  # Six independent RTSP capture loops. DeepStream/NVDEC is preferred when it
  # is available; GStreamer remains the fallback so one backend failure does
  # not take the service down.
  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 1.0

  capture_backend: "auto"
  rtsp_transport: "auto"
  rtsp_latency_ms: 150
  rtsp_buffer_mode: "auto"
  drop_on_latency: true
  tcp_timestamp: false
  udp_buffer_size: 1048576
  decoder_extra_surfaces: 4
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1
  deepstream_reconnect_interval_sec: 2
  deepstream_reconnect_attempts: -1

  # Kill/rebuild a camera pipe only when it has genuinely drifted far behind.
  # This prevents old decoded frames from becoming a growing latency queue.
  max_pipeline_lag_ms: 650
  max_pipeline_lag_samples: 8

  detector:
    enabled: true
    model: "yolo26m.pt"
    model_fallback: "yolo26m.pt"
    device: "cuda:0"
    imgsz: [448, 704]
    quantize: 32
    classes: [0]
    conf: 0.10
    iou: 0.50
    max_det: 30

    # Two-frame CUDA batches are intentionally conservative for the first
    # six-camera baseline. We will raise this only after VRAM/latency telemetry.
    batch_size: 2
    poll_interval_ms: 4
    start_delay_sec: 1.0

    # Real-time freshness beats completeness: stale inputs/results are dropped.
    max_submit_age_ms: 260
    max_result_age_ms: 700
    overlay_max_age_ms: 700

    duplicate_iou: 0.58
    fusion_containment: 0.84
    fusion_center_distance: 0.40

    hard_exclusion:
      max_box_height_ratio: 0.30
      overlap_threshold: 0.15
      cameras: {}

    # No secondary passes in the baseline. One detector, one full-frame pass.
    roi_second_pass:
      enabled: false
      cameras: {}

  # This is presentation tracking only, not another AI model. It keeps boxes
  # visually smooth between sparse detector updates without feeding evidence
  # back into detection.
  visual_tracker:
    hold_ms: 700
    memory_ms: 2200
    prediction_ms: 320
    match_iou: 0.12
    reacquire_distance: 0.80
    byte_match_center: 0.68
    byte_second_match_iou: 0.04
    byte_second_match_center: 0.48
    low_match_max_age_ms: 550
    byte_high_conf: 0.24
    byte_low_conf: 0.08
    low_conf_confirm: 0.08

    process_noise: 0.85
    measurement_noise: 0.90
    velocity_damping: 0.95
    size_velocity_damping: 0.60
    max_prediction_shift_boxes: 0.60
    max_prediction_size_ratio: 0.06
    adaptive_error_low: 0.08
    adaptive_error_high: 0.25
    center_response_slow: 0.42
    center_response_fast: 0.88
    size_response: 0.30
    snap_distance_boxes: 0.65
    reversal_damping: 0.15

    duplicate_iou: 0.68
    duplicate_containment: 0.90
    duplicate_center_distance: 0.20
    fragment_duplicate_cameras: []

    start_conf: 0.24
    new_track_min_conf: 0.18
    strong_confirm_hits: 2
    weak_confirm_hits: 3
    camera_start_conf: {}
    camera_low_conf_confirm: {}
    camera_new_track_zones: {}
    exclusion_max_box_height: 0.30
    exclusion_overlap_threshold: 0.15
    camera_exclusion_zones: {}
