core_v1:
  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  display_fps: 12
  jpeg_quality: 76
  max_display_width: 800
  max_display_height: 450
  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 2.0

  rtsp_transport: "tcp"
  rtsp_latency_ms: 50
  rtsp_buffer_mode: "auto"
  drop_on_latency: false
  tcp_timestamp: true
  decoder_extra_surfaces: 2
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1

  detector:
    enabled: true
    model: "models/yolo26m.pt"
    device: "cuda:0"
    imgsz: [448, 704]
    quantize: 32
    conf: 0.06
    iou: 0.50
    max_det: 50
    batch_size: 3
    poll_interval_ms: 5
    start_delay_sec: 2.0
    duplicate_iou: 0.58
    fusion_containment: 0.84
    fusion_center_distance: 0.40
    overlay_max_age_ms: 300

    # Camera-specific high-resolution verification/recovery. Full-frame YOLO
    # always remains active outside these boxes.
    roi_second_pass:
      enabled: true
      imgsz: [512, 640]
      conf: 0.045
      iou: 0.50
      max_det: 20
      every_n: 2
      trigger_max_full_roi_persons: 1
      cameras:
        # entrance-1 desk/chair region: use high-res as source of truth there.
        # This removes persistent chair/fixture false positives while retaining
        # true people in the same area.
        CAM-05:
          mode: "verify"
          every_n: 1
          always_run: true
          accept_conf: 0.11
          rotations: [0]
          box: [0.27, 0.00, 0.72, 0.54]

        # main-room-2 sofa region: horizontal/lying people are difficult for the
        # normal full-frame view. Run the same crop at 0/90/270 degrees and map
        # detections back to the original frame. High-res result is authoritative
        # inside the region so furniture false positives are discarded.
        CAM-06:
          mode: "verify"
          every_n: 1
          always_run: true
          accept_conf: 0.075
          rotations: [0, 90, 270]
          box: [0.39, 0.08, 0.74, 0.52]

  visual_tracker:
    hold_ms: 1600
    prediction_ms: 450
    memory_ms: 6000
    match_iou: 0.16
    reacquire_distance: 1.05
    duplicate_iou: 0.50
    duplicate_containment: 0.82
    duplicate_center_distance: 0.40

    fragment_duplicate_cameras: ["CAM-03", "CAM-05", "CAM-06"]
    fragment_horizontal_overlap: 0.64
    fragment_x_center: 0.34
    fragment_max_area_ratio: 0.76
    fragment_min_vertical_overlap: 0.08
    fragment_max_vertical_gap: 0.14

    # Favor newest measurement and predict to the current display-frame time so
    # boxes follow a walking person instead of trailing behind detector latency.
    smoothing: 0.90
    velocity_smoothing: 0.62
    max_prediction_shift_boxes: 1.35
    start_conf: 0.18
    low_conf_confirm: 0.12

    # Entrance chair clutter must repeat strongly before becoming a visible track.
    camera_start_conf:
      CAM-05: 0.26
    camera_low_conf_confirm:
      CAM-05: 0.18

    # Hard restriction is ONLY the physical wall TV itself, not the sofa below.
    # This prevents people displayed on the TV from becoming CCTV people while a
    # real person lying/sitting on the sofa remains eligible for CAM-06 ROI recovery.
    exclusion_max_box_height: 0.20
    camera_exclusion_zones:
      CAM-06:
        - [0.51, 0.00, 0.68, 0.15]
