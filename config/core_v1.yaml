core_v1:
  profile: "detection-tracking-smooth-v2"

  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  # Keep one presentation cadence close to the actual CCTV cadence. Frames are
  # never queued to reach this rate: if work falls behind, the newest frame wins.
  display_fps: 20
  jpeg_quality: 70
  max_display_width: 736
  max_display_height: 416
  publisher_start_stagger_ms: 10

  # Six independent RTSP capture loops. DeepStream/NVDEC is preferred.
  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 1.0

  capture_backend: "auto"
  rtsp_transport: "auto"
  rtsp_latency_ms: 150
  rtsp_buffer_mode: "auto"
  drop_on_latency: true
  tcp_timestamp: false
  udp_buffer_size: 1048576
  decoder_extra_surfaces: 4
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1
  deepstream_reconnect_interval_sec: 2
  deepstream_reconnect_attempts: -1

  # Critical smoothness optimization: decode can remain at the camera's native
  # resolution, but nvvideoconvert scales on the NVIDIA path before the RAW BGR
  # frame is copied into Python. This removes the six-camera full-HD host-copy
  # bottleneck and also matches the detector input exactly.
  capture_output_width: 736
  capture_output_height: 416
  capture_metrics_interval_sec: 5.0

  # Do not rebuild a healthy RTSP pipe for a brief jitter spike. A sustained
  # stale stream is still reconnected, but short LAN jitter is allowed to heal.
  max_pipeline_lag_ms: 900
  max_pipeline_lag_samples: 20

  detector:
    enabled: true
    model: "yolo26m.pt"
    model_fallback: "yolo26m.pt"
    device: "cuda:0"
    imgsz: [416, 736]
    quantize: 32
    classes: [0]

    conf: 0.08
    iou: 0.50
    max_det: 30

    # Keep conservative latency until real six-camera telemetry proves a larger
    # batch helps. Camera smoothness is intentionally independent of this batch.
    batch_size: 2
    poll_interval_ms: 4
    start_delay_sec: 1.0

    max_submit_age_ms: 260
    max_result_age_ms: 700
    overlay_max_age_ms: 700

    duplicate_iou: 0.58
    fusion_containment: 0.84
    fusion_center_distance: 0.40

    hard_exclusion:
      max_box_height_ratio: 0.30
      overlap_threshold: 0.15
      cameras: {}

    roi_second_pass:
      enabled: false
      cameras: {}

  visual_tracker:
    tracker_type: "bytetrack-hungarian"
    assignment_solver: "hungarian"
    fuse_score: true

    hold_ms: 800
    memory_ms: 2500
    prediction_ms: 320

    match_iou: 0.12
    reacquire_distance: 0.82
    byte_match_center: 0.70
    byte_second_match_iou: 0.04
    byte_second_match_center: 0.50
    low_match_max_age_ms: 600

    byte_high_conf: 0.25
    byte_low_conf: 0.08
    low_conf_confirm: 0.08
    start_conf: 0.25
    new_track_min_conf: 0.25
    strong_confirm_hits: 2
    weak_confirm_hits: 3

    process_noise: 0.85
    measurement_noise: 0.90
    velocity_damping: 0.95
    size_velocity_damping: 0.60
    max_prediction_shift_boxes: 0.60
    max_prediction_size_ratio: 0.06
    adaptive_error_low: 0.08
    adaptive_error_high: 0.25
    center_response_slow: 0.42
    center_response_fast: 0.88
    size_response: 0.30
    snap_distance_boxes: 0.65
    reversal_damping: 0.15

    duplicate_iou: 0.68
    duplicate_containment: 0.90
    duplicate_center_distance: 0.20
    fragment_duplicate_cameras: []

    camera_start_conf: {}
    camera_low_conf_confirm: {}
    camera_new_track_zones: {}
    exclusion_max_box_height: 0.30
    exclusion_overlap_threshold: 0.15
    camera_exclusion_zones: {}
