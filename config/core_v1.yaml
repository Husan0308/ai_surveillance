core_v1:
  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  display_fps: 12
  jpeg_quality: 76
  max_display_width: 800
  max_display_height: 450
  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 2.0

  rtsp_transport: "tcp"
  rtsp_latency_ms: 50
  rtsp_buffer_mode: "auto"
  drop_on_latency: false
  tcp_timestamp: true
  decoder_extra_surfaces: 2
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1

  detector:
    enabled: true
    model: "models/yolo26m.pt"
    device: "cuda:0"
    imgsz: [448, 704]
    quantize: 32
    conf: 0.06
    iou: 0.50
    max_det: 50
    batch_size: 3
    poll_interval_ms: 5
    start_delay_sec: 2.0
    duplicate_iou: 0.70
    fusion_containment: 0.90
    fusion_center_distance: 0.30
    overlay_max_age_ms: 300

    roi_second_pass:
      enabled: true
      imgsz: [512, 640]
      conf: 0.045
      iou: 0.50
      max_det: 20
      every_n: 2
      trigger_max_full_roi_persons: 1
      cameras:
        CAM-05:
          box: [0.27, 0.00, 0.72, 0.54]

  visual_tracker:
    hold_ms: 1600
    prediction_ms: 450
    memory_ms: 6000
    match_iou: 0.16
    reacquire_distance: 1.05
    duplicate_iou: 0.50
    duplicate_containment: 0.82
    duplicate_center_distance: 0.40

    # CAM-05 has a high-resolution ROI second pass. A seated/occluded person can
    # therefore be returned once as a large body box and again as a tighter
    # upper-body fragment. Enable the stricter fragment rule only on that camera
    # so nearby real people in the other views are unaffected.
    fragment_duplicate_cameras: ["CAM-05"]
    fragment_horizontal_overlap: 0.70
    fragment_x_center: 0.30
    fragment_max_area_ratio: 0.70
    fragment_min_vertical_overlap: 0.12
    fragment_max_vertical_gap: 0.10

    smoothing: 0.72
    start_conf: 0.18
    low_conf_confirm: 0.12

    exclusion_max_box_height: 0.22
    camera_exclusion_zones:
      CAM-06:
        - [0.48, 0.00, 0.70, 0.18]
