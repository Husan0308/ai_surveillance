core_v1:
  # Stable baseline: camera -> YOLO26m -> visual tracker -> JPEG -> UI.
  # Optional analytics stay off until this path passes real 6-camera acceptance.
  profile: "stable-detection-ui-baseline"

  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  display_fps: 15
  jpeg_quality: 72
  max_display_width: 640
  max_display_height: 360
  publisher_start_stagger_ms: 15

  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 1.0

  capture_backend: "auto"
  max_pipeline_lag_ms: 0
  max_pipeline_lag_samples: 8
  rtsp_transport: "auto"
  rtsp_latency_ms: 150
  rtsp_buffer_mode: "auto"
  drop_on_latency: true
  tcp_timestamp: false
  udp_buffer_size: 1048576
  decoder_extra_surfaces: 4
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1
  deepstream_reconnect_interval_sec: 2
  deepstream_reconnect_attempts: -1

  detector:
    enabled: true

    # A plain Ultralytics checkpoint name is intentional. The stable worker
    # uses a project-local file when present and otherwise lets Ultralytics
    # resolve/download this checkpoint.
    model: "yolo26m.pt"
    model_fallback: "yolo26m.pt"
    device: "cuda:0"

    imgsz: [448, 704]
    quantize: 32
    conf: 0.10
    iou: 0.50
    max_det: 50
    batch_size: 2
    poll_interval_ms: 5
    start_delay_sec: 2.0

    duplicate_iou: 0.58
    fusion_containment: 0.84
    fusion_center_distance: 0.40

    max_submit_age_ms: 350
    max_result_age_ms: 950
    overlay_max_age_ms: 950

    # Custom masks/second-pass logic are deliberately disabled in the clean
    # baseline. Re-enable only after normal full-frame detection is proven.
    hard_exclusion:
      max_box_height_ratio: 0.30
      overlap_threshold: 0.15
      cameras: {}

    roi_second_pass:
      enabled: false
      imgsz: [512, 640]
      conf: 0.08
      iou: 0.50
      max_det: 20
      every_n: 2
      trigger_max_full_roi_persons: 1
      cameras: {}

  visual_tracker:
    hold_ms: 800
    memory_ms: 3000
    prediction_ms: 420
    match_iou: 0.12
    reacquire_distance: 0.85
    byte_match_center: 0.70
    byte_second_match_iou: 0.04
    byte_second_match_center: 0.50
    low_match_max_age_ms: 650
    byte_high_conf: 0.24
    byte_low_conf: 0.08
    low_conf_confirm: 0.08
    process_noise: 0.85
    measurement_noise: 0.90
    velocity_damping: 0.96
    size_velocity_damping: 0.60
    max_prediction_shift_boxes: 0.68
    max_prediction_size_ratio: 0.08
    adaptive_error_low: 0.08
    adaptive_error_high: 0.25
    center_response_slow: 0.42
    center_response_fast: 0.88
    size_response: 0.30
    snap_distance_boxes: 0.65
    reversal_damping: 0.15
    duplicate_iou: 0.68
    duplicate_containment: 0.90
    duplicate_center_distance: 0.20
    fragment_duplicate_cameras: []
    fragment_horizontal_overlap: 0.78
    fragment_x_center: 0.18
    fragment_max_area_ratio: 0.55
    fragment_min_vertical_overlap: 0.20
    fragment_max_vertical_gap: 0.06
    start_conf: 0.24
    new_track_min_conf: 0.18
    strong_confirm_hits: 2
    weak_confirm_hits: 3
    camera_start_conf: {}
    camera_low_conf_confirm: {}
    camera_new_track_zones: {}
    exclusion_max_box_height: 0.30
    exclusion_overlap_threshold: 0.15
    camera_exclusion_zones: {}

  # Phase 2. Kept in the repository, but never allowed to gate detector ready.
  pose:
    enabled: false
    model: "yolo26m-pose.pt"
    device: "inherit"
    imgsz: 256
    conf: 0.25
    half: true
    every_n: 8
    max_people: 2
    max_cameras_per_batch: 1
    max_frame_age_ms: 850
    max_detector_ms_before_pose: 350

  # Phase 3. Requires stable pose + valid camera-to-floor homographies.
  heatmap:
    enabled: false
    coordinate_system: "normalized_room_floor"
    grid_width: 96
    grid_height: 64
    poll_interval_ms: 120
    ankle_conf: 0.35
    sample_weight: 1.0
    sigma_cells: 2.2
    hot_hold_sec: 3600
    cool_half_life_sec: 3600
    bucket_sec: 300
    max_history_sec: 21600
    min_bucket_weight: 0.02
    dedupe_window_ms: 800
    dedupe_distance: 0.06
    fallback_bbox_bottom: false

  # Phase 2. Re-enable only after detector/UI soak is clean.
  reid:
    enabled: false
    model: "osnet_ain_x1_0"
    model_path: "models/reid/osnet_ain_x1_0_msmt17.pth"
    device: "cpu"
    torch_cpu_threads: 1
    input_height: 256
    input_width: 128
    flip_tta: true
    poll_interval_ms: 35
    min_track_hits: 2
    local_track_timeout_sec: 3.0
    local_match_iou: 0.10
    local_match_center: 0.82
    embed_cooldown_sec: 0.60
    refresh_sec: 2.0
    quality_improvement: 0.03
    batch_size: 4
    batch_wait_ms: 20
    queue_size: 8
    max_job_age_ms: 800
