core_v1:
  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  display_fps: 12
  jpeg_quality: 76
  max_display_width: 800
  max_display_height: 450
  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 2.0

  rtsp_transport: "tcp"
  rtsp_latency_ms: 50
  rtsp_buffer_mode: "auto"
  drop_on_latency: false
  tcp_timestamp: true
  decoder_extra_surfaces: 2
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1

  detector:
    enabled: true
    model: "models/yolo26m.pt"
    device: "cuda:0"
    imgsz: [448, 704]
    quantize: 32
    conf: 0.06
    iou: 0.50
    max_det: 50
    batch_size: 3
    poll_interval_ms: 5
    start_delay_sec: 2.0
    duplicate_iou: 0.70
    fusion_containment: 0.90
    fusion_center_distance: 0.30
    overlay_max_age_ms: 300

    # Selective high-resolution second pass for the difficult entrance camera.
    # Full-frame inference still runs, so people outside this box remain eligible.
    # The ROI is only an additional zoomed inference around the desk/chair area.
    roi_second_pass:
      enabled: true
      imgsz: [512, 640]
      conf: 0.045
      iou: 0.50
      max_det: 20
      # Run at most every other detector observation to protect GTX 1050 Ti headroom.
      every_n: 2
      # If the full frame already found two people in the ROI, skip the extra pass.
      trigger_max_full_roi_persons: 1
      cameras:
        CAM-05:
          box: [0.27, 0.00, 0.72, 0.54]

  visual_tracker:
    hold_ms: 1600
    prediction_ms: 450
    memory_ms: 6000
    match_iou: 0.16
    reacquire_distance: 1.05
    duplicate_iou: 0.50
    duplicate_containment: 0.82
    duplicate_center_distance: 0.40
    smoothing: 0.72
    start_conf: 0.18
    low_conf_confirm: 0.12

    # This is NOT a detection ROI. It is a tiny UI/visual exclusion only for the
    # known TV screen false-positive. The detector still sees the whole frame.
    exclusion_max_box_height: 0.22
    camera_exclusion_zones:
      CAM-06:
        - [0.48, 0.00, 0.70, 0.18]
