core_v1:
  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  # Stable latest-only presentation baseline. Higher JPEG FPS does not reduce
  # detector latency and only adds CPU encode/network/UI work on this hardware.
  display_fps: 12
  jpeg_quality: 76
  max_display_width: 800
  max_display_height: 450
  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 1.0

  # Rebuild only the drifting RTSP pipeline. The one-slot frame store is kept,
  # so reconnect never replays historical frames.
  max_pipeline_lag_ms: 1200
  max_pipeline_lag_samples: 8

  rtsp_transport: "tcp"
  rtsp_latency_ms: 50
  rtsp_buffer_mode: "auto"
  drop_on_latency: false
  tcp_timestamp: true
  decoder_extra_surfaces: 2
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1

  detector:
    enabled: true
    model: "models/yolo26m.pt"
    device: "cuda:0"
    imgsz: [448, 704]
    quantize: 32
    conf: 0.06
    iou: 0.50
    max_det: 50
    batch_size: 3
    poll_interval_ms: 5
    start_delay_sec: 2.0
    duplicate_iou: 0.58
    fusion_containment: 0.84
    fusion_center_distance: 0.40

    # Realtime freshness gates. Old frames are not worth GPU time; old results
    # are not allowed to overwrite current visual state.
    max_submit_age_ms: 300
    max_result_age_ms: 650
    overlay_max_age_ms: 450

    # Detector-level hard mask: TV candidates are discarded before ROI fusion,
    # tracker birth, metrics and rendering. Tall real people in front of the TV
    # remain eligible because the mask only rejects relatively short boxes.
    hard_exclusion:
      max_box_height_ratio: 0.30
      overlap_threshold: 0.15
      cameras:
        CAM-06:
          - [0.50, 0.00, 0.78, 0.22]

    # Second-pass inference is bounded. CAM-05 remains a reduced-frequency
    # verifier for persistent desk/chair clutter. CAM-06 is conditional: its sofa
    # crop runs only when the full-frame pass sees no person centered in the ROI.
    roi_second_pass:
      enabled: true
      imgsz: [512, 640]
      conf: 0.045
      iou: 0.50
      max_det: 20
      every_n: 2
      trigger_max_full_roi_persons: 1
      cameras:
        CAM-05:
          mode: "verify"
          every_n: 2
          always_run: false
          accept_conf: 0.11
          rotations: [0]
          trigger_max_full_roi_persons: 1
          box: [0.27, 0.00, 0.72, 0.54]

        CAM-06:
          mode: "augment"
          every_n: 2
          always_run: false
          accept_conf: 0.075
          rotations: [0]
          trigger_max_full_roi_persons: 0
          box: [0.36, 0.12, 0.74, 0.48]

  visual_tracker:
    # Internal memory survives short occlusion, while stale geometry disappears
    # quickly and is never used as identity evidence.
    hold_ms: 500
    prediction_ms: 220
    memory_ms: 6000
    match_iou: 0.16
    reacquire_distance: 1.05
    duplicate_iou: 0.50
    duplicate_containment: 0.82
    duplicate_center_distance: 0.40

    fragment_duplicate_cameras: ["CAM-03", "CAM-05", "CAM-06"]
    fragment_horizontal_overlap: 0.64
    fragment_x_center: 0.34
    fragment_max_area_ratio: 0.76
    fragment_min_vertical_overlap: 0.08
    fragment_max_vertical_gap: 0.14

    smoothing: 0.96
    velocity_smoothing: 0.66
    max_prediction_shift_boxes: 0.75

    # Birth/continue split: strong new people need 2 observations, medium need 3,
    # low-score detections can only refresh an existing track.
    start_conf: 0.34
    new_track_min_conf: 0.24
    strong_confirm_hits: 2
    weak_confirm_hits: 3
    low_conf_confirm: 0.12

    camera_start_conf:
      CAM-05: 0.30
      CAM-06: 0.38
    camera_low_conf_confirm:
      CAM-05: 0.18

    # Static clutter requires stronger evidence to create a new person, but an
    # already tracked real person may continue through these regions.
    camera_new_track_zones:
      CAM-05:
        - [0.27, 0.00, 0.72, 0.54, 0.38]
      CAM-06:
        - [0.36, 0.12, 0.76, 0.49, 0.42]

    # Keep the same mask in the visual layer as a defense-in-depth guard. The
    # primary rejection now happens earlier inside detector.py.
    exclusion_max_box_height: 0.30
    exclusion_overlap_threshold: 0.15
    camera_exclusion_zones:
      CAM-06:
        - [0.50, 0.00, 0.78, 0.22]
