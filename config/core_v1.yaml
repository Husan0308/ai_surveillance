core_v1:
  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  # Presentation is separate from inference. Most cameras deliver about 19-21
  # decoded FPS. Publish up to 18 FPS, with a small JPEG to keep CPU bounded.
  display_fps: 18
  jpeg_quality: 72
  max_display_width: 720
  max_display_height: 405
  publisher_start_stagger_ms: 8
  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 1.0

  # Capture backend: prefer DeepStream nvurisrcbin/NVDEC when the plugin exists,
  # otherwise automatically fall back to the previous GStreamer/NVDEC path.
  # DeepStream is used for ingest/decode only; YOLO stays PyTorch CUDA.
  capture_backend: "auto"

  # Do not reconnect only from clock/PTS lag. Real stalls are recovered by
  # source errors/timeouts and DeepStream's RTSP reconnect support.
  max_pipeline_lag_ms: 0
  max_pipeline_lag_samples: 8

  # A tiny 50 ms jitterbuffer was too aggressive for six office RTSP feeds and
  # can manifest as stop/go playback when packet arrival is bursty. Give the
  # source a bounded 150 ms window and DROP late packets instead of allowing the
  # jitterbuffer to grow. "auto" lets RTP try the normal UDP path with TCP
  # fallback instead of forcing TCP head-of-line blocking on every camera.
  rtsp_transport: "auto"
  rtsp_latency_ms: 150
  rtsp_buffer_mode: "auto"
  drop_on_latency: true
  tcp_timestamp: false
  udp_buffer_size: 1048576

  # Extra NVDEC surfaces reduce decoder starvation under six concurrent streams.
  # low-latency-mode stays false because it is only safe for streams without
  # B-frames; the camera GOP structure is not guaranteed yet.
  decoder_extra_surfaces: 4
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1

  # nvurisrcbin handles source-level RTSP stalls independently per camera.
  deepstream_reconnect_interval_sec: 2
  deepstream_reconnect_attempts: -1

  detector:
    enabled: true
    model: "models/yolo26m.pt"
    device: "cuda:0"
    imgsz: [448, 704]
    quantize: 32
    conf: 0.06
    iou: 0.50
    max_det: 50
    batch_size: 3
    poll_interval_ms: 5
    start_delay_sec: 2.0
    duplicate_iou: 0.58
    fusion_containment: 0.84
    fusion_center_distance: 0.40

    max_submit_age_ms: 300
    max_result_age_ms: 900
    overlay_max_age_ms: 900

    hard_exclusion:
      max_box_height_ratio: 0.30
      overlap_threshold: 0.15
      cameras:
        CAM-06:
          - [0.50, 0.00, 0.78, 0.22]

    roi_second_pass:
      enabled: true
      imgsz: [512, 640]
      conf: 0.045
      iou: 0.50
      max_det: 20
      every_n: 2
      trigger_max_full_roi_persons: 1
      cameras:
        CAM-05:
          mode: "verify"
          every_n: 2
          always_run: false
          accept_conf: 0.11
          rotations: [0]
          trigger_max_full_roi_persons: 1
          box: [0.27, 0.00, 0.72, 0.54]

        CAM-06:
          mode: "augment"
          every_n: 2
          always_run: false
          accept_conf: 0.075
          rotations: [0]
          trigger_max_full_roi_persons: 0
          box: [0.36, 0.12, 0.74, 0.48]

  visual_tracker:
    hold_ms: 900
    prediction_ms: 500
    memory_ms: 6000
    match_iou: 0.16
    reacquire_distance: 1.05
    duplicate_iou: 0.50
    duplicate_containment: 0.82
    duplicate_center_distance: 0.40

    fragment_duplicate_cameras: ["CAM-03", "CAM-05", "CAM-06"]
    fragment_horizontal_overlap: 0.64
    fragment_x_center: 0.34
    fragment_max_area_ratio: 0.76
    fragment_min_vertical_overlap: 0.08
    fragment_max_vertical_gap: 0.14

    smoothing: 0.96
    velocity_smoothing: 0.62
    max_prediction_shift_boxes: 0.60

    start_conf: 0.34
    new_track_min_conf: 0.24
    strong_confirm_hits: 2
    weak_confirm_hits: 3
    low_conf_confirm: 0.12

    camera_start_conf:
      CAM-05: 0.30
      CAM-06: 0.38
    camera_low_conf_confirm:
      CAM-05: 0.18

    camera_new_track_zones:
      CAM-05:
        - [0.27, 0.00, 0.72, 0.54, 0.38]
      CAM-06:
        - [0.36, 0.12, 0.76, 0.49, 0.42]

    exclusion_max_box_height: 0.30
    exclusion_overlap_threshold: 0.15
    camera_exclusion_zones:
      CAM-06:
        - [0.50, 0.00, 0.78, 0.22]
