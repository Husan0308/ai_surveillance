core_v1:
  profile: "detection-tracking-reid-smooth-v4"

  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  display_fps: 20
  jpeg_quality: 70
  max_display_width: 736
  max_display_height: 416
  publisher_start_stagger_ms: 10

  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 1.0

  capture_backend: "auto"
  rtsp_transport: "auto"
  rtsp_latency_ms: 150
  rtsp_buffer_mode: "auto"
  drop_on_latency: true
  tcp_timestamp: false
  udp_buffer_size: 1048576
  decoder_extra_surfaces: 4
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1
  deepstream_reconnect_interval_sec: 2
  deepstream_reconnect_attempts: -1

  capture_output_width: 736
  capture_output_height: 416
  capture_metrics_interval_sec: 5.0

  max_pipeline_lag_ms: 900
  max_pipeline_lag_samples: 20

  detector:
    enabled: true
    model: "yolo26m.pt"
    model_fallback: "yolo26m.pt"
    device: "cuda:0"
    imgsz: [416, 736]
    quantize: 32
    classes: [0]

    conf: 0.08
    iou: 0.50
    max_det: 30

    batch_size: 2
    poll_interval_ms: 4
    start_delay_sec: 1.0

    max_submit_age_ms: 260
    max_result_age_ms: 700
    overlay_max_age_ms: 700

    duplicate_iou: 0.58
    fusion_containment: 0.84
    fusion_center_distance: 0.40

    hard_exclusion:
      max_box_height_ratio: 0.30
      overlap_threshold: 0.15
      cameras: {}

    roi_second_pass:
      enabled: false
      cameras: {}

  visual_tracker:
    tracker_type: "bytetrack-hungarian-ownership"
    assignment_solver: "hungarian"
    fuse_score: true

    # Prefer a short identity hold over assigning an existing ID to a nearby
    # different person. This remains the authoritative per-camera tracker.
    ownership_lock: true
    ownership_min_hits: 3
    ownership_margin: 0.09
    ownership_low_margin_multiplier: 1.50
    ownership_proximity: 0.70
    ownership_overlap_iou: 0.08
    ownership_iou_advantage: 0.14
    ownership_distance_advantage: 0.14
    ownership_max_competitor_age_ms: 700

    id_namespace_stride: 10000

    hold_ms: 850
    memory_ms: 2800
    prediction_ms: 340

    match_iou: 0.12
    reacquire_distance: 0.78
    byte_match_center: 0.66
    byte_second_match_iou: 0.05
    byte_second_match_center: 0.46
    low_match_max_age_ms: 600

    byte_high_conf: 0.25
    byte_low_conf: 0.08
    low_conf_confirm: 0.08
    start_conf: 0.25
    new_track_min_conf: 0.25
    strong_confirm_hits: 2
    weak_confirm_hits: 3

    process_noise: 0.82
    measurement_noise: 0.88
    velocity_damping: 0.95
    size_velocity_damping: 0.60
    max_prediction_shift_boxes: 0.55
    max_prediction_size_ratio: 0.06
    adaptive_error_low: 0.08
    adaptive_error_high: 0.25
    center_response_slow: 0.42
    center_response_fast: 0.84
    size_response: 0.30
    snap_distance_boxes: 0.62
    reversal_damping: 0.15

    duplicate_iou: 0.68
    duplicate_containment: 0.90
    duplicate_center_distance: 0.20
    fragment_duplicate_cameras: []

    camera_start_conf: {}
    camera_low_conf_confirm: {}
    camera_new_track_zones: {}
    exclusion_max_box_height: 0.30
    exclusion_overlap_threshold: 0.15
    camera_exclusion_zones: {}

  # Cross-camera identity is deliberately a low-rate CPU side-path. It never
  # gates camera capture, YOLO detection, local tracking or JPEG publication.
  reid:
    enabled: true
    model_name: "osnet_x0_25"
    device: "cpu"
    cpu_threads: 2
    input_height: 256
    input_width: 128

    model_path: "models/reid/osnet_x0_25_msmt17_combineall.pth"
    model_url: "https://huggingface.co/kaiyangzhou/osnet/resolve/main/osnet_x0_25_msmt17_combineall_256x128_amsgrad_ep150_stp60_lr0.0015_b64_fb10_softmax_labelsmooth_flip_jitter.pth"
    model_sha256: "cf55163d78fc44c62c82f85ab62d39f10438679b5abe8c698ae08cfa84aa6e18"
    download_if_missing: true

    poll_interval_ms: 120
    sample_interval_ms: 650
    max_batch: 6
    min_samples: 3
    max_samples: 6

    # Reject weak, tiny, blurred or overlapping crops before OSNet. This is more
    # valuable than feeding every frame to ReID and contaminating the gallery.
    min_crop_height_px: 70
    min_crop_width_px: 24
    min_area_ratio: 0.012
    min_track_confidence: 0.24
    max_crop_overlap_iou: 0.24
    min_blur_variance: 20.0
    tracklet_outlier_similarity: 0.52

    # Conservative identity policy: both absolute similarity and separation from
    # the runner-up matter. Even a very strong match needs a small margin if a
    # second viable look-alike identity is present; ambiguity creates a new ID.
    match_similarity: 0.76
    same_group_similarity: 0.70
    same_camera_similarity: 0.73
    strong_similarity: 0.86
    second_best_margin: 0.06
    strong_second_best_margin: 0.025

    # Existing prototypes only learn from very confident assignments, preventing
    # one bad crop from poisoning a person's future identity.
    prototype_update_similarity: 0.86
    prototype_update_alpha: 0.10

    active_timeout_sec: 1.6
    gallery_ttl_sec: 21600
    min_cross_group_transition_sec: 1.5
    global_prefix: "G"

    # The two cameras in each group view the same physical room, so one Global ID
    # may legitimately be active in both at once. A Global ID cannot be active in
    # two unrelated groups at the same time.
    overlap_groups:
      - ["CAM-01", "CAM-04"]
      - ["CAM-02", "CAM-05"]
      - ["CAM-03", "CAM-06"]

    pair_thresholds:
      "CAM-01|CAM-04": 0.69
      "CAM-02|CAM-05": 0.69
      "CAM-03|CAM-06": 0.69
