core_v1:
  profile: "detection-tracking-room-consensus-reid-face-cuda-v2"

  ml_host: "0.0.0.0"
  ml_port: 8001
  api_host: "0.0.0.0"
  api_port: 8000

  display_fps: 20
  jpeg_quality: 70
  max_display_width: 736
  max_display_height: 416
  publisher_start_stagger_ms: 10

  startup_grace_sec: 8.0
  startup_stagger_sec: 0.20
  capture_timeout_ms: 1000
  max_read_timeouts: 3
  reconnect_delay_sec: 1.0

  capture_backend: "auto"
  rtsp_transport: "auto"
  rtsp_latency_ms: 150
  rtsp_buffer_mode: "auto"
  drop_on_latency: true
  tcp_timestamp: false
  udp_buffer_size: 1048576
  decoder_extra_surfaces: 4
  decoder_low_latency_mode: false
  postdecode_queue_buffers: 1
  deepstream_reconnect_interval_sec: 2
  deepstream_reconnect_attempts: -1

  capture_output_width: 736
  capture_output_height: 416
  capture_metrics_interval_sec: 5.0
  max_pipeline_lag_ms: 900
  max_pipeline_lag_samples: 20

  detector:
    enabled: true
    model: "yolo26m.pt"
    model_fallback: "yolo26m.pt"
    device: "cuda:0"
    imgsz: [416, 736]
    quantize: 32
    classes: [0]
    conf: 0.08
    iou: 0.50
    max_det: 30
    batch_size: 2
    poll_interval_ms: 4
    start_delay_sec: 1.0
    max_submit_age_ms: 260
    max_result_age_ms: 700
    overlay_max_age_ms: 700
    duplicate_iou: 0.58
    fusion_containment: 0.84
    fusion_center_distance: 0.40
    hard_exclusion:
      max_box_height_ratio: 0.30
      overlap_threshold: 0.15
      cameras: {}
    roi_second_pass:
      enabled: false
      cameras: {}

  visual_tracker:
    tracker_type: "bytetrack-hungarian-ownership"
    assignment_solver: "hungarian"
    fuse_score: true
    ownership_lock: true
    ownership_min_hits: 3
    ownership_margin: 0.09
    ownership_low_margin_multiplier: 1.50
    ownership_proximity: 0.70
    ownership_overlap_iou: 0.08
    ownership_iou_advantage: 0.14
    ownership_distance_advantage: 0.14
    ownership_max_competitor_age_ms: 700
    id_namespace_stride: 10000
    hold_ms: 850
    memory_ms: 2800
    prediction_ms: 340
    match_iou: 0.12
    reacquire_distance: 0.78
    byte_match_center: 0.66
    byte_second_match_iou: 0.05
    byte_second_match_center: 0.46
    low_match_max_age_ms: 600
    byte_high_conf: 0.25
    byte_low_conf: 0.08
    low_conf_confirm: 0.08
    start_conf: 0.25
    new_track_min_conf: 0.25
    strong_confirm_hits: 2
    weak_confirm_hits: 3
    process_noise: 0.82
    measurement_noise: 0.88
    velocity_damping: 0.95
    size_velocity_damping: 0.60
    max_prediction_shift_boxes: 0.55
    max_prediction_size_ratio: 0.06
    adaptive_error_low: 0.08
    adaptive_error_high: 0.25
    center_response_slow: 0.42
    center_response_fast: 0.84
    size_response: 0.30
    snap_distance_boxes: 0.62
    reversal_damping: 0.15
    duplicate_iou: 0.68
    duplicate_containment: 0.90
    duplicate_center_distance: 0.20
    fragment_duplicate_cameras: []
    camera_start_conf: {}
    camera_low_conf_confirm: {}
    camera_new_track_zones: {}
    exclusion_max_box_height: 0.30
    exclusion_overlap_threshold: 0.15
    camera_exclusion_zones: {}

  reid:
    enabled: true
    model_name: "osnet_ain_x1_0"
    device: "cpu"
    cpu_threads: 2
    input_height: 256
    input_width: 128
    model_path: "models/reid/osnet_ain_x1_0_msmt17.pth"
    model_url: "https://huggingface.co/kaiyangzhou/osnet/resolve/main/osnet_ain_x1_0_msmt17_256x128_amsgrad_ep50_lr0.0015_coslr_b64_fb10_softmax_labsmth_flip_jitter.pth"
    model_sha256: "8a07e8da38946f7cee37f4561617bf8b6d2fe8f3a4027852893ea092e46d919f"
    download_if_missing: true
    poll_interval_ms: 100
    sample_interval_ms: 420
    max_batch: 4
    min_samples: 3
    confirm_min_samples: 3
    max_samples: 7
    min_crop_height_px: 42
    min_crop_width_px: 14
    min_area_ratio: 0.0035
    min_track_confidence: 0.20
    max_crop_overlap_iou: 0.30
    min_blur_variance: 9.0
    tracklet_outlier_similarity: 0.50
    match_similarity: 0.78
    same_group_similarity: 0.74
    same_camera_similarity: 0.76
    strong_similarity: 0.88
    second_best_margin: 0.055
    strong_second_best_margin: 0.025
    prototype_update_similarity: 0.88
    prototype_update_alpha: 0.07
    room_embedding_weight: 0.90
    room_colour_weight: 0.10
    room_min_embedding_similarity: 0.66
    room_single_similarity: 0.71
    room_pair_similarity: 0.75
    room_pair_margin: 0.035
    room_confirmed_merge_similarity: 0.90
    colour_ema_alpha: 0.28
    same_camera_handoff_sec: 2.6
    same_camera_handoff_similarity: 0.84
    same_camera_handoff_distance: 0.85
    fast_single_similarity: 0.80
    fast_pair_similarity: 0.85
    fast_pair_margin: 0.045
    fast_confirm_similarity: 0.74
    confirmed_pair_merge_similarity: 0.90
    active_timeout_sec: 1.8
    gallery_ttl_sec: 21600
    min_cross_group_transition_sec: 1.5
    global_prefix: "G"
    overlap_groups:
      - ["CAM-01", "CAM-04"]
      - ["CAM-02", "CAM-05"]
      - ["CAM-03", "CAM-06"]
    pair_thresholds:
      "CAM-01|CAM-04": 0.74
      "CAM-02|CAM-05": 0.74
      "CAM-03|CAM-06": 0.74

  face:
    enabled: true
    provider: "CUDAExecutionProvider"
    device_id: 0
    allow_cpu_fallback: true
    gpu_mem_limit_mb: 768
    cuda_cudnn_conv_algo_search: "HEURISTIC"
    # buffalo_m keeps the same ResNet50 recognition accuracy as buffalo_l but
    # uses the much lighter SCRFD-2.5GF detector. InsightFace does not mark this
    # pack Auto=Y, so provision the official v0.7 release asset ourselves.
    model_pack: "buffalo_m"
    model_root: "models/insightface"
    model_url: "https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_m.zip"
    model_sha256: "d98264bd8f2dc75cbc2ddce2a14e636e02bb857b3051c234b737bf3b614edca9"
    download_if_missing: true
    data_dir: "data/faces"
    db_path: "data/face_db.json"
    det_size: 320
    det_thresh: 0.55
    poll_interval_ms: 200
    sample_interval_ms: 1300
    max_people_per_camera: 2
    upper_body_ratio: 0.60
    horizontal_pad_ratio: 0.16
    min_face_size_px: 28
    min_blur_variance: 18.0
    match_similarity: 0.52
    strong_similarity: 0.68
    second_best_margin: 0.06
    strong_second_best_margin: 0.025
    confirm_hits: 2
    confirm_window_sec: 4.0
    local_binding_ttl_sec: 45
    global_binding_ttl_sec: 21600
    enrollment_samples: 10
    enrollment_min_quality: 0.56
    enrollment_consistency_similarity: 0.35
    enrollment_max_outliers: 1
    enrollment_token_ttl_sec: 600
