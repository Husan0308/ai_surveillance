reid:
  enabled: true

  # NVIDIA ReIdentificationNet runs in an isolated Python 3.10 / TensorRT 8.6
  # subprocess so DeepStream 7.1's TensorRT 10 runtime is never mixed with TRT 8.6.
  backend: trt86_worker
  trt86_python: .venv-trt86/bin/python
  trt86_worker: scripts/reid_trt86_worker.py
  trt86_engine: artifacts/reid/resnet50_market1501_aicity156_b1-8_fp32_trt86.engine
  trt86_timeout_sec: 5.0
  trt86_jpeg_quality: 95

  # CPU backends remain available by switching backend back to "auto".
  download_if_missing: true
  cpu_threads: 2

  # Sparse detector frames arrive around 3 Hz/camera. Three independent good
  # observations can therefore produce a provisional Global ID quickly.
  sample_interval_sec: 0.28
  embed_batch: 4
  crop_queue: 48
  min_crop_quality: 0.34
  duplicate_hamming: 5
  duplicate_window_sec: 1.2
  max_track_samples: 10
  top_k: 3
  gallery_size: 12
  min_samples: 3
  new_identity_confirm_samples: 4

  # Conservative open-world matching. These are starting thresholds; production
  # calibration must use positive and hard-negative score logs from these exact
  # cameras and the selected ReID backend.
  provisional_similarity: 0.68
  confirm_similarity: 0.77
  strong_similarity: 0.86
  reject_similarity: 0.56
  min_margin: 0.045
  strong_margin: 0.025
  confirm_votes: 2

  # Protect the canonical appearance gallery from a mistaken cross-camera merge.
  # A confirmed track can use a Global ID at lower score, but its crops only update
  # the canonical gallery when independent ReID evidence is strong.
  prototype_update_similarity: 0.82
  reid_rollback_votes: 4

  # A local NvDCF ID may disappear behind a chair/desk and come back as a new local
  # ID. Tracker snapshots release the missing local binding quickly while the
  # Global-ID gallery remains alive for same-person reconnect.
  active_timeout_sec: 1.8
  missing_active_grace_sec: 0.35
  lost_timeout_sec: 8.0
  same_camera_reconnect_sec: 90000.0
  same_camera_reconnect_similarity: 0.62
  same_camera_reconnect_confirm_similarity: 0.72

  # Daily reconnect safety:
  # require a clear winner to avoid merging people in similar clothing.
  daily_reconnect_min_margin: 0.08

  # Never create a duplicate Daily ID while an existing identity is
  # still plausibly similar.
  daily_new_identity_max_similarity: 0.50

  # Moderate long-gap reconnect requires repeated evidence + clear margin.
  # Similar clothing with a close runner-up therefore stays ambiguous.
  daily_reconnect_vote_similarity: 0.56
  daily_reconnect_vote_margin: 0.10
  daily_reconnect_votes: 4

  daily_ambiguous_hold_similarity: 0.56
  gallery_ttl_sec: 21600

  # Different rooms cannot contain the same Global ID simultaneously. Same-room
  # paired cameras are allowed to share one Global ID at the same time.
  min_room_transition_sec: 0.8
  rollback_contradictions: 2
