name: Camera V2 Detection Only Static

on:
  push:
    branches:
      - feature/ml-detection-pose-gate-20260826
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -m py_compile \
            services/camera_v2/detection_only_pose.py \
            services/camera_v2/detection_only_pose_v3.py \
            services/camera_v2/detection_resolution_capture.py \
            services/camera_v2/pose_gate_v3.py \
            services/camera_v2/pose_gate_v2.py \
            services/camera_v2/yolo_trt86_fresh_bridge.py \
            services/camera_v2/yolo_trt86_shm_bridge.py \
            scripts/check_yolo26_exact_frame_parity.py \
            scripts/sweep_yolo26_exact_frame_models.py \
            scripts/sweep_yolo26_source_resolution.py
      - name: Bash syntax
        run: |
          bash -n scripts/run_camera_v2_detection_only_pose.sh
          bash -n scripts/run_camera_v2_detection_parity.sh
          bash -n scripts/run_camera_v2_resolution_capture.sh
      - name: Detection-only architecture contract
        run: |
          grep -q 'CAMERA_V2_FRAME_WIDTH:-1280' scripts/run_camera_v2_detection_only_pose.sh
          grep -q 'CAMERA_V2_FRAME_HEIGHT:-720' scripts/run_camera_v2_detection_only_pose.sh
          grep -q 'CAMERA_V2_WALL_WIDTH:-1920' scripts/run_camera_v2_detection_only_pose.sh
          grep -q 'CAMERA_V2_WALL_HEIGHT:-720' scripts/run_camera_v2_detection_only_pose.sh
          grep -q 'CAMERA_V2_DETECT_TARGET_HZ:-0.33' scripts/run_camera_v2_detection_only_pose.sh
          grep -q 'CAMERA_V2_DETECT_CONF:-0.08' scripts/run_camera_v2_detection_only_pose.sh
          grep -q 'CAMERA_V2_POSE_GATE_MODEL:-yolo26s-pose.pt' scripts/run_camera_v2_detection_only_pose.sh
          grep -q 'CAMERA_V2_POSE_GATE_MAX_CANDIDATES:-2' scripts/run_camera_v2_detection_only_pose.sh
          grep -q 'detection_only_pose_v3' scripts/run_camera_v2_detection_only_pose.sh
          grep -q 'external_nms=0 geometry_dedup=0' scripts/run_camera_v2_detection_only_pose.sh
          grep -q 'def _install_osd_and_meta' services/camera_v2/detection_only_pose.py
          grep -q 'nvdcf=0 osd=0 metadata_injection=0' services/camera_v2/detection_only_pose.py
          grep -q 'no geometry de-dup here' services/camera_v2/detection_only_pose.py
          grep -q 'interpolation-method", 1' services/camera_v2/detection_only_pose.py
          grep -q 'CAMERA_DETECTION_PREPROCESS' services/camera_v2/detection_only_pose.py
          grep -q 'detector interpolation=' services/camera_v2/detection_only_pose.py
          grep -q 'def _source_to_tee' services/camera_v2/detection_only_pose_v3.py
          grep -q 'display_inline_ml=0 nvdcf=0 osd=0 dedup=0' services/camera_v2/detection_only_pose_v3.py
          ! grep -q '_dedup_raw_rows' services/camera_v2/detection_only_pose.py
          ! grep -q '_dedup_and_expand' services/camera_v2/detection_only_pose.py
          ! grep -q 'person_nvdcf_tracker' scripts/run_camera_v2_detection_only_pose.sh
          ! grep -q 'nvdsosd' scripts/run_camera_v2_detection_only_pose.sh
      - name: Exact-frame parity contract
        run: |
          grep -q 'CAM-01,CAM-02,CAM-04,CAM-05' scripts/run_camera_v2_detection_parity.sh
          grep -q 'np.save' services/camera_v2/yolo_trt86_shm_bridge.py
          grep -q 'allow_pickle=False' services/camera_v2/yolo_trt86_shm_bridge.py
          grep -q 'end2end=end2end' scripts/check_yolo26_exact_frame_parity.py
          grep -q 'TRT_MISS' scripts/check_yolo26_exact_frame_parity.py
          grep -q 'ONE_TO_MANY_RECOVERS' scripts/check_yolo26_exact_frame_parity.py
          grep -q 'yolo26s.pt,yolo26m.pt' scripts/sweep_yolo26_exact_frame_models.py
          grep -q 'YOLO26_MODEL_SWEEP_CAMERA' scripts/sweep_yolo26_exact_frame_models.py
          grep -q 'upscaling these saved 672x384 frames cannot restore lost detail' scripts/sweep_yolo26_exact_frame_models.py
      - name: High-resolution recall contract
        run: |
          grep -q 'CAM-01,CAM-02,CAM-04,CAM-05' scripts/run_camera_v2_resolution_capture.sh
          grep -q 'CAMERA_V2_RES_CAPTURE_WIDTH:-1920' scripts/run_camera_v2_resolution_capture.sh
          grep -q 'CAMERA_V2_RES_CAPTURE_HEIGHT:-1080' scripts/run_camera_v2_resolution_capture.sh
          grep -q 'gate=preconvert' services/camera_v2/detection_resolution_capture.py
          grep -q 'CAMERA_RES_CAPTURE_SAVED' services/camera_v2/detection_resolution_capture.py
          grep -q '672x384,896x512,1024x576' scripts/sweep_yolo26_source_resolution.py
          grep -q 'rect=False' scripts/sweep_yolo26_source_resolution.py
          grep -q 'YOLO26_RES_SWEEP_CAMERA' scripts/sweep_yolo26_source_resolution.py
