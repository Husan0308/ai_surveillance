name: camera-v11-step7-one-person-static

on:
  push:
    branches:
      - rebuild/service-architecture-v11-clean-step4-crosscamera-reid-v1-20260828
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Step7 files
        run: |
          python -m py_compile \
            services/camera_v11/step4_reid_gallery_recent_runtime_v1.py \
            services/camera_v11/step4_reid_pair_runtime_v1.py \
            services/camera_v11/step5_global_shadow_runtime_v1.py \
            services/camera_v11/step6_global_shadow_runtime_v1.py \
            scripts/check_camera_v11_step4_reid_pair_scorer_v1_log.py \
            scripts/check_camera_v11_step7_cam01_cam04_one_person_v1.py \
            scripts/test_camera_v11_step7_cam01_cam04_one_person_v1.py \
            scripts/test_camera_v11_step7_runtime_wiring_v1.py
          bash -n scripts/run_camera_v11_step7_cam01_cam04_one_person_acceptance_v1.sh
      - name: Guard bounded recent gallery wiring
        run: |
          grep -q 'class V11Step4ReIDPairRuntimeV1(V11Step4ReIDGalleryRecentRuntimeV1)' services/camera_v11/step4_reid_pair_runtime_v1.py
          grep -q 'self.reid_gallery.cleanup_expired(int(captured_ns))' services/camera_v11/step4_reid_gallery_recent_runtime_v1.py
          ! grep -q 'self.reid_gallery.touch_active' services/camera_v11/step4_reid_gallery_recent_runtime_v1.py
      - name: Run Step7 checker tests
        run: python scripts/test_camera_v11_step7_cam01_cam04_one_person_v1.py
      - name: Run Step7 wiring regression tests
        run: python scripts/test_camera_v11_step7_runtime_wiring_v1.py
      - name: Frozen Step1-3 guard
        run: python scripts/check_camera_v11_frozen_step123_guard.py
