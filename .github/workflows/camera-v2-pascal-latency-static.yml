name: Camera V2 Pascal TRT86 Latency Static

on:
  push:
    branches:
      - fix/pascal-trt86-latency-20260826
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -m py_compile \
            services/camera_v2/pascal_runtime.py \
            services/camera_v2/person_tracking_pascal_trt86.py \
            services/camera_v2/person_tracking_trt86_fresh.py \
            services/camera_v2/yolo_trt86_shm_bridge.py \
            scripts/yolo26_trt86_shm_worker.py \
            scripts/yolo26_trt86_shm_worker_v4.py
      - name: Bash syntax
        run: bash -n scripts/run_camera_v2_pascal_trt86.sh
      - name: Low-latency contract
        run: |
          grep -q 'CAMERA_V2_RTSP_LATENCY_MS:-50' scripts/run_camera_v2_pascal_trt86.sh
          grep -q 'CAMERA_V2_DETECT_TARGET_HZ:-0.50' scripts/run_camera_v2_pascal_trt86.sh
          grep -q 'yolo26_trt86_shm_worker_v4.py' scripts/run_camera_v2_pascal_trt86.sh
          grep -q 'CAMERA_PASCAL_RATE_GUARD' services/camera_v2/pascal_runtime.py
          grep -q 'tcp-timestamp' services/camera_v2/pascal_runtime.py
          grep -q 'detector_scale=bilinear' services/camera_v2/pascal_runtime.py
          grep -q 'execute_async_v2' scripts/yolo26_trt86_shm_worker_v4.py
          grep -q 'cudaStreamCreateWithFlags' scripts/yolo26_trt86_shm_worker_v4.py
          grep -q 'frame\[:3' scripts/yolo26_trt86_shm_worker_v4.py
          grep -q 'frame\[381:' scripts/yolo26_trt86_shm_worker_v4.py
          ! grep -q 'channel_spread' scripts/yolo26_trt86_shm_worker_v4.py
