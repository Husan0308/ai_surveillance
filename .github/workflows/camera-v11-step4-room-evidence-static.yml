name: Camera V11 Step4 Room Evidence Static

on:
  push:
    branches:
      - rebuild/service-architecture-v11-clean-step4-crosscamera-reid-v1-20260828

jobs:
  room-evidence-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile evidence path
        run: |
          python -m py_compile \
            services/camera_v11/step4_room_evidence_v1.py \
            services/camera_v11/step4_tracking_reid_v2.py
      - name: Evidence safety invariants
        run: |
          grep -Fq 'class V11RoomEvidenceWriterV1' services/camera_v11/step4_room_evidence_v1.py
          grep -Fq 'if not self.enabled or len(members) < 2:' services/camera_v11/step4_room_evidence_v1.py
          grep -Fq 'max_per_member: int = 4' services/camera_v11/step4_room_evidence_v1.py
          grep -Fq 'embedding: np.ndarray' services/camera_v11/step4_room_evidence_v1.py
          grep -Fq 'pair_scores.tsv' services/camera_v11/step4_room_evidence_v1.py
          grep -Fq 'audit.tsv' services/camera_v11/step4_room_evidence_v1.py
          grep -Fq 'comparison.jpg' services/camera_v11/step4_room_evidence_v1.py
          grep -Fq 'top2_mean' services/camera_v11/step4_room_evidence_v1.py
          grep -Fq 'SUSPECT' services/camera_v11/step4_room_evidence_v1.py
          grep -Fq 'V11_STEP4_ROOM_EVIDENCE_DIR' services/camera_v11/step4_tracking_reid_v2.py
          grep -Fq 'V11_STEP4_ROOM_EVIDENCE_SUSPECT_SCORE' services/camera_v11/step4_tracking_reid_v2.py
          grep -Fq 'CAMERA_V11_STEP4_ROOM_EVIDENCE_SAVE' services/camera_v11/step4_tracking_reid_v2.py
          grep -Fq 'CAMERA_V11_STEP4_ROOM_EVIDENCE_AUDIT' services/camera_v11/step4_tracking_reid_v2.py
          grep -Fq 'embedding=result.embedding' services/camera_v11/step4_tracking_reid_v2.py
          grep -Fq 'self.room_evidence.capture_room' services/camera_v11/step4_tracking_reid_v2.py
      - name: Frozen Step3 guard
        run: |
          git diff --exit-code d2c9e62f9ed2b5f80dc9a4d496e0fda94afddc51 -- \
            services/camera_v11/step1_cam02_lowlat_v7.py \
            services/camera_v11/step1_independent_egl_v4.py \
            services/camera_v11/step2_production_fp32.py \
            services/camera_v11/step2_production_fp32_v12.py \
            services/camera_v11/step2_production_fp32_v13.py \
            services/camera_v11/step2_production_fp32_v18.py \
            services/camera_v11/step2_trt86.py \
            services/camera_v11/step3_tracker_v2.py \
            services/camera_v11/step3_tracking_v2.py \
            scripts/run_camera_v11_step3_tracker_v2.sh \
            scripts/check_camera_v11_step3_tracker_v2_log.py
