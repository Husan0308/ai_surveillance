name: ML Detector JIT Demand Static

on:
  push:
    branches:
      - rebuild/service-architecture-v4-jit-demand-20260826
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -m py_compile \
            services/camera_service/app/shm_frame.py \
            services/camera_service/app/runtime.py \
            services/camera_service/app/runtime_shm.py \
            services/ml_service/app/detector_only_shm.py \
            scripts/yolo26_trt86_shm_worker_v4.py
      - name: Bash syntax
        run: |
          bash -n scripts/run_camera_service_shm.sh
          bash -n scripts/run_ml_detector_shm.sh
      - name: Demand-driven boundary contract
        run: |
          grep -q 'class FrameDemandOwner' services/camera_service/app/shm_frame.py
          grep -q 'class FrameDemandClient' services/camera_service/app/shm_frame.py
          grep -q 'mode=demand-jit' services/camera_service/app/runtime_shm.py
          grep -q '_ml_demand_gate_probe' services/camera_service/app/runtime_shm.py
          grep -q 'requested <= served' services/camera_service/app/runtime_shm.py
          grep -q 'policy=request-next-frame' scripts/run_camera_service_shm.sh
          grep -q 'producer_rate=consumer-driven' scripts/run_camera_service_shm.sh
          grep -q 'FrameDemandClient' services/ml_service/app/detector_only_shm.py
          grep -q '_request_fresh_frame' services/ml_service/app/detector_only_shm.py
          grep -q 'policy=demand-jit-one-frame-per-inference' services/ml_service/app/detector_only_shm.py
          grep -q 'gpu_overlap=convert-before-trt' services/ml_service/app/detector_only_shm.py
          grep -q 'ML_DETECTOR_TARGET_HZ:-2.0' scripts/run_ml_detector_shm.sh
          grep -q 'ML_DETECTOR_CAPTURE_TIMEOUT_MS:-300' scripts/run_ml_detector_shm.sh
          grep -q 'CAMERA_SERVICE_HEADLESS:-1' scripts/run_camera_service_shm.sh
          ! grep -q 'CAMERA_SERVICE_ML_TAP_HZ' scripts/run_camera_service_shm.sh
          ! grep -q '_collect_candidates' services/ml_service/app/detector_only_shm.py
      - name: TRT86 interpreter isolation contract
        run: |
          grep -q '_absolute_without_resolving_symlink' services/ml_service/app/detector_only_shm.py
          grep -q '\[str(self.python), "-I", str(self.worker)' services/ml_service/app/detector_only_shm.py
          grep -q 'child_env.pop("PYTHONHOME"' services/ml_service/app/detector_only_shm.py
          grep -q 'child_env.pop("PYTHONPATH"' services/ml_service/app/detector_only_shm.py
