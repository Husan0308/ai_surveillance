name: ML Detector JIT Demand Static

on:
  push:
    branches:
      - rebuild/service-architecture-v4-jit-demand-20260826
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -m py_compile \
            services/camera_service/app/shm_frame.py \
            services/camera_service/app/runtime.py \
            services/camera_service/app/runtime_shm.py \
            services/ml_service/app/detector_only_shm.py \
            scripts/yolo26_trt86_shm_worker_v4.py
      - name: Bash syntax
        run: |
          bash -n scripts/run_camera_service_shm.sh
          bash -n scripts/run_ml_detector_shm.sh
      - name: Demand-driven boundary contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shm = Path('services/camera_service/app/shm_frame.py').read_text()
          camera = Path('services/camera_service/app/runtime_shm.py').read_text()
          ml = Path('services/ml_service/app/detector_only_shm.py').read_text()
          camera_run = Path('scripts/run_camera_service_shm.sh').read_text()
          ml_run = Path('scripts/run_ml_detector_shm.sh').read_text()

          required = {
              'FrameDemandOwner': 'class FrameDemandOwner' in shm,
              'FrameDemandClient': 'class FrameDemandClient' in shm,
              'camera demand gate': '_ml_demand_gate_probe' in camera,
              'camera request/served guard': 'requested <= served' in camera,
              'camera demand mode': 'mode=demand-jit' in camera,
              'camera consumer-driven launch': 'producer_rate=consumer-driven' in camera_run,
              'ML request client': 'FrameDemandClient' in ml,
              'ML fresh request': '_request_fresh_frame' in ml,
              'ML JIT policy': 'demand-jit-one-frame-per-inference' in ml,
              'convert-before-TRT': 'convert-before-trt' in ml,
              'target cadence': 'ML_DETECTOR_TARGET_HZ' in ml_run,
              'capture timeout': 'ML_DETECTOR_CAPTURE_TIMEOUT_MS' in ml_run,
              'headless camera default': 'CAMERA_SERVICE_HEADLESS' in camera_run,
              'old fixed camera tap removed': 'CAMERA_SERVICE_ML_TAP_HZ' not in camera_run,
              'old push candidate scheduler removed': '_collect_candidates' not in ml,
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit('contract failed: ' + ', '.join(failed))
          print('JIT_DEMAND_STATIC_CONTRACT status=OK')
          PY
      - name: TRT86 interpreter isolation contract
        run: |
          grep -q '_absolute_without_resolving_symlink' services/ml_service/app/detector_only_shm.py
          grep -q '\[str(self.python), "-I", str(self.worker)' services/ml_service/app/detector_only_shm.py
          grep -q 'child_env.pop("PYTHONHOME"' services/ml_service/app/detector_only_shm.py
          grep -q 'child_env.pop("PYTHONPATH"' services/ml_service/app/detector_only_shm.py
