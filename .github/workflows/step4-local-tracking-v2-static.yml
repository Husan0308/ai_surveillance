name: Step4 Local Tracking V2 Static

on:
  push:
    branches:
      - rebuild/service-architecture-step4-local-tracking-v2-20260827
  pull_request:
    paths:
      - 'services/ml_service/app/local_tracker.py'
      - 'services/ml_service/app/local_tracker_sparse_v2.py'
      - 'services/ml_service/app/detector_substream_tracking.py'
      - 'services/ml_service/app/detector_substream_tracking_v2.py'
      - 'scripts/run_ml_tracking_step4_v2.sh'
      - 'scripts/test_step4_local_tracker.py'
      - 'scripts/test_step4_sparse_recovery_v2.py'
      - '.github/workflows/step4-local-tracking-v2-static.yml'

jobs:
  tracker-v2-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal CPU test dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile Step 4 v2 modules
        run: |
          python -m py_compile \
            services/ml_service/app/local_tracker.py \
            services/ml_service/app/local_tracker_sparse_v2.py \
            services/ml_service/app/detector_substream_tracking.py \
            services/ml_service/app/detector_substream_tracking_v2.py \
            scripts/test_step4_local_tracker.py \
            scripts/test_step4_sparse_recovery_v2.py
      - name: Original crossing and recovery smoke test
        run: python scripts/test_step4_local_tracker.py
      - name: Sparse lost-low-recovery fragmentation smoke test
        run: python scripts/test_step4_sparse_recovery_v2.py
      - name: Guard frozen detector boundary
        run: |
          grep -q 'ML_SUBSTREAM_TOKEN_CAPACITY:-3' scripts/run_ml_tracking_step4_v2.sh
          grep -q 'ML_DETECTOR_TARGET_HZ:-2.0' scripts/run_ml_tracking_step4_v2.sh
          grep -q 'ML_TRACK_REACQUIRE_THRESH:-0.12' scripts/run_ml_tracking_step4_v2.sh
          grep -q 'ML_TRACK_LOW_RECOVERY_THRESH:-0.10' scripts/run_ml_tracking_step4_v2.sh
          grep -q 'gpu_tracker=0' scripts/run_ml_tracking_step4_v2.sh
          grep -q 'reid=0' scripts/run_ml_tracking_step4_v2.sh
          grep -q 'global_id=0' scripts/run_ml_tracking_step4_v2.sh
