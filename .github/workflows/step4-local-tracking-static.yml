name: Step4 Local Tracking Static

on:
  push:
    branches:
      - rebuild/service-architecture-step4-local-tracking-v1-20260827
  pull_request:
    paths:
      - 'services/ml_service/app/local_tracker.py'
      - 'services/ml_service/app/detector_substream_tracking.py'
      - 'scripts/run_ml_tracking_step4.sh'
      - 'scripts/test_step4_local_tracker.py'
      - '.github/workflows/step4-local-tracking-static.yml'

jobs:
  tracker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal CPU test dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile Step 4 modules
        run: |
          python -m py_compile \
            services/ml_service/app/local_tracker.py \
            services/ml_service/app/detector_substream_tracking.py \
            scripts/test_step4_local_tracker.py
      - name: Direct script crossing, low-score and recovery smoke test
        run: python scripts/test_step4_local_tracker.py
      - name: Guard frozen detector boundary
        run: |
          grep -q 'ML_SUBSTREAM_TOKEN_CAPACITY:-3' scripts/run_ml_tracking_step4.sh
          grep -q 'ML_DETECTOR_TARGET_HZ:-2.0' scripts/run_ml_tracking_step4.sh
          grep -q 'gpu_tracker=0' scripts/run_ml_tracking_step4.sh
          grep -q 'reid=0' scripts/run_ml_tracking_step4.sh
          grep -q 'global_id=0' scripts/run_ml_tracking_step4.sh
