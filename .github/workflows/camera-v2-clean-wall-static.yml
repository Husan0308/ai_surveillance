name: Camera V2 Clean Wall Static

on:
  push:
    branches:
      - fix/camera-v2-clean-wall-20260826
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -m py_compile \
            services/camera_v2/main.py \
            services/camera_v2/dynamic_wall.py \
            services/camera_v2/secure.py \
            services/camera_v2/clean_wall.py
      - name: Bash syntax
        run: bash -n scripts/run_camera_v2_clean_wall.sh
      - name: Camera-only architecture contract
        run: |
          grep -q 'CAMERA_V2_FRAME_WIDTH:-1280' scripts/run_camera_v2_clean_wall.sh
          grep -q 'CAMERA_V2_FRAME_HEIGHT:-720' scripts/run_camera_v2_clean_wall.sh
          grep -q 'CAMERA_V2_WALL_WIDTH:-1920' scripts/run_camera_v2_clean_wall.sh
          grep -q 'CAMERA_V2_WALL_HEIGHT:-720' scripts/run_camera_v2_clean_wall.sh
          grep -q 'CAMERA_V2_TILER_COLUMNS:-3' scripts/run_camera_v2_clean_wall.sh
          grep -q 'detector=1 tracker=1 appsink=1 shm=1 tensorrt=1 osd=1 global_id=1' scripts/run_camera_v2_clean_wall.sh
          grep -q 'class CleanCameraWallV2(SecureCameraWallV2)' services/camera_v2/clean_wall.py
          grep -q 'interpolation-method", 4' services/camera_v2/clean_wall.py
          grep -q 'CAMERA_CLEAN_PIPELINE_AUDIT status=OK' services/camera_v2/clean_wall.py
          grep -q 'CAMERA_CLEAN_SOURCE_STAGGER' services/camera_v2/clean_wall.py
          grep -q 'CAMERA_CLEAN_PROCESS_RESTART' services/camera_v2/clean_wall.py
          ! grep -q 'person_tracking_pascal_trt86' scripts/run_camera_v2_clean_wall.sh
          ! grep -q 'yolo_trt86' scripts/run_camera_v2_clean_wall.sh
          ! grep -q 'nvtracker' scripts/run_camera_v2_clean_wall.sh
