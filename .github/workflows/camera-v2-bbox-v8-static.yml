name: Camera V2 BBox V8 Static

on:
  push:
    branches:
      - rebuild/service-architecture-step4-v8-pascal-batch-lowlatency-20260827
  pull_request:

jobs:
  v8-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile V8 Python
        run: |
          python -m py_compile \
            services/camera_v2/yolo_trt86_batch6_bridge.py \
            services/camera_v2/runtime_v8_pascal.py \
            scripts/yolo26_trt86_batch6_worker_v8.py \
            scripts/build_yolo26_batch6_trt86_v8.py \
            scripts/export_yolo26_batch6_onnx_v8.py \
            scripts/check_trt86_batch6_isolation_v8.py \
            scripts/check_camera_v2_bbox_v8_log.py

      - name: Shell syntax
        run: |
          bash -n scripts/prepare_yolo26_batch6_v8.sh
          bash -n scripts/cleanup_camera_v8_workers.sh
          bash -n scripts/run_camera_v2_bbox_v8.sh

      - name: Bbox policy regressions
        run: python scripts/test_camera_v2_bbox_v7.py

      - name: Guard no detector tracker serialization
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'SerializedGpuLaneRuntime' services/camera_v2/runtime_v8_pascal.py
          ! grep -q 'gpu_lane.acquire' services/camera_v2/runtime_v8_pascal.py
          ! grep -q 'PadProbeReturn.DROP' services/camera_v2/runtime_v8_pascal.py
          grep -q 'tracker_drop_for_detector=0' services/camera_v2/runtime_v8_pascal.py
          grep -q 'gpu_lane=removed' services/camera_v2/runtime_v8_pascal.py

      - name: Guard true batch-six detector
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'BATCH_SIZE = 6' services/camera_v2/yolo_trt86_batch6_bridge.py
          grep -q 'BATCH = 6' scripts/yolo26_trt86_batch6_worker_v8.py
          grep -q 'EXPECTED_INPUT = (BATCH, 3, INPUT_H, INPUT_W)' scripts/yolo26_trt86_batch6_worker_v8.py
          grep -q 'EXPECTED_OUTPUT = (BATCH, 300, 6)' scripts/yolo26_trt86_batch6_worker_v8.py
          grep -q 'cudaHostAlloc' scripts/yolo26_trt86_batch6_worker_v8.py
          grep -q 'execute_async_v2' scripts/yolo26_trt86_batch6_worker_v8.py
          grep -q 'coalesced-latest-six' services/camera_v2/yolo_trt86_batch6_bridge.py

      - name: Guard Pascal and low-latency policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CAMERA_V2_RTSP_LATENCY_MS=.*60' scripts/run_camera_v2_bbox_v8.sh
          grep -q 'CAMERA_V2_TRACK_FPS=.*8' scripts/run_camera_v2_bbox_v8.sh
          grep -q 'CAMERA_V8_DETECT_GPU_BUDGET=.*0.28' scripts/run_camera_v2_bbox_v8.sh
          grep -q 'native_nvinfer=0' scripts/run_camera_v2_bbox_v8.sh
          grep -q 'latest_only_queues=1' scripts/run_camera_v2_bbox_v8.sh
          grep -q 'useColorNames.*"1"' services/camera_v2/runtime_v8_pascal.py
          grep -q 'useHog.*"0"' services/camera_v2/runtime_v8_pascal.py
          grep -q 'featureImgSizeLevel.*"2"' services/camera_v2/runtime_v8_pascal.py

      - name: Guard offline observable TensorRT build
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'builder_optimization_level = optimization_level' scripts/build_yolo26_batch6_trt86_v8.py
          grep -q 'create_timing_cache' scripts/build_yolo26_batch6_trt86_v8.py
          grep -q 'set_timing_cache' scripts/build_yolo26_batch6_trt86_v8.py
          grep -q 'Logger.INFO' scripts/build_yolo26_batch6_trt86_v8.py
          grep -q 'V8_ENGINE_BUILD_PROGRESS' scripts/build_yolo26_batch6_trt86_v8.py
          grep -q 'CAMERA_V8_TRT_BUILD_OPT_LEVEL:-2' scripts/prepare_yolo26_batch6_v8.sh
          grep -q 'batch-6 engine missing' scripts/run_camera_v2_bbox_v8.sh
          ! grep -q 'if.*DETECT_ENABLED.*prepare_yolo26_batch6_v8.sh' scripts/run_camera_v2_bbox_v8.sh
