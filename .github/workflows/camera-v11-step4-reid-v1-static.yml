name: Camera V11 Step4 ReID V1 Static

on:
  push:
    branches:
      - rebuild/service-architecture-v11-clean-step4-crosscamera-reid-v1-20260828

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile Step4 Python
        run: |
          python -m py_compile \
            services/camera_v11/step4_reid_trt86.py \
            services/camera_v11/step4_reid_scheduler_v1.py \
            services/camera_v11/step4_camera_tracklet_v1.py \
            services/camera_v11/step4_identity_shadow_v1.py \
            services/camera_v11/step4_room_identity_v1.py \
            services/camera_v11/step4_tracking_reid_v1.py \
            scripts/reid_trt86_worker_v11.py \
            scripts/benchmark_camera_v11_step4_reid_v1.py \
            scripts/build_camera_v11_step4_reid_trt86.py
      - name: Check Step4 shell syntax
        run: |
          bash -n scripts/prepare_camera_v11_step4_reid_v1.sh
          bash -n scripts/ensure_camera_v11_trt86_runtime_v1.sh
          bash -n scripts/run_camera_v11_step4_reid_benchmark_v1.sh
          bash -n scripts/run_camera_v11_step4_tracking_reid_v1.sh
          grep -q 'api.ngc.nvidia.com/v2/models/nvidia/tao/reidentificationnet/versions/deployable_v1.2/files/resnet50_market1501_aicity156.onnx' scripts/prepare_camera_v11_step4_reid_v1.sh
          grep -q '0e21d09278508ec835955f422a9fdd3cd59b2a6ecdef98d705f388f33cebac2b' scripts/prepare_camera_v11_step4_reid_v1.sh
      - name: TensorRT 8.6 profile API guard
        run: |
          grep -q 'profile.set_shape' scripts/build_camera_v11_step4_reid_trt86.py
          grep -q 'profile.get_shape' scripts/build_camera_v11_step4_reid_trt86.py
          grep -q 'add_optimization_profile' scripts/build_camera_v11_step4_reid_trt86.py
          ! grep -q 'if not profile.set_shape' scripts/build_camera_v11_step4_reid_trt86.py
      - name: Benchmark import-path guard
        run: |
          grep -Fq 'ROOT = Path(__file__).resolve().parents[1]' scripts/benchmark_camera_v11_step4_reid_v1.py
          grep -Fq 'sys.path.insert(0, root_text)' scripts/benchmark_camera_v11_step4_reid_v1.py
          grep -Fq 'engine = ROOT / engine' scripts/benchmark_camera_v11_step4_reid_v1.py
      - name: TRT86 runtime isolation guard
        run: |
          grep -Fq 'numpy.core._multiarray_umath' scripts/ensure_camera_v11_trt86_runtime_v1.sh
          grep -Fq 'artifacts/reid/python_trt86_site' scripts/ensure_camera_v11_trt86_runtime_v1.sh
          grep -Fq '.v11_runtime_paths.json' scripts/ensure_camera_v11_trt86_runtime_v1.sh
          grep -Fq 'tensorrt_root' scripts/ensure_camera_v11_trt86_runtime_v1.sh
          grep -Fq 'WORKER_MODE=PASS' scripts/ensure_camera_v11_trt86_runtime_v1.sh
          grep -Fq -- '"$PYTHON" -I -c' scripts/ensure_camera_v11_trt86_runtime_v1.sh
          grep -Fq -- '--only-binary=:all:' scripts/ensure_camera_v11_trt86_runtime_v1.sh
          grep -Fq -- '--ignore-installed' scripts/ensure_camera_v11_trt86_runtime_v1.sh
          grep -Fq -- '--target "$tmp"' scripts/ensure_camera_v11_trt86_runtime_v1.sh
          grep -Fq 'numpy==$NUMPY_VERSION' scripts/ensure_camera_v11_trt86_runtime_v1.sh
          grep -Fq 'TRT86_RUNTIME_MANIFEST = TRT86_RUNTIME_SITE / ".v11_runtime_paths.json"' services/camera_v11/step4_reid_trt86.py
          grep -Fq 'runtime["tensorrt_root"]' services/camera_v11/step4_reid_trt86.py
          grep -Fq 'sys.path[:0]=' services/camera_v11/step4_reid_trt86.py
          grep -Fq "runpy.run_path" services/camera_v11/step4_reid_trt86.py
          ! grep -Fq 'sudo pip' scripts/ensure_camera_v11_trt86_runtime_v1.sh
          ! grep -Fq 'apt install' scripts/ensure_camera_v11_trt86_runtime_v1.sh
      - name: Shared-memory ownership guard
        run: |
          grep -Fq 'from multiprocessing import resource_tracker, shared_memory' scripts/reid_trt86_worker_v11.py
          grep -Fq 'def attach_nonowning_shared_memory' scripts/reid_trt86_worker_v11.py
          grep -Fq 'resource_tracker.unregister(shm._name, "shared_memory")' scripts/reid_trt86_worker_v11.py
          grep -Fq 'self.input_shm = attach_nonowning_shared_memory(input_shm_name)' scripts/reid_trt86_worker_v11.py
          grep -Fq 'self.output_shm = attach_nonowning_shared_memory(output_shm_name)' scripts/reid_trt86_worker_v11.py
      - name: Live scheduler invariants
        run: |
          grep -Fq 'max_batch: int = 2' services/camera_v11/step4_reid_scheduler_v1.py
          grep -Fq 'self.max_batch = max(1, min(4, int(max_batch)))' services/camera_v11/step4_reid_scheduler_v1.py
          grep -Fq 'OrderedDict' services/camera_v11/step4_reid_scheduler_v1.py
          grep -Fq 'self._pending[key] = (candidate, enqueued_ns)' services/camera_v11/step4_reid_scheduler_v1.py
          grep -Fq 'self._pending.popitem(last=False)' services/camera_v11/step4_reid_scheduler_v1.py
          grep -Fq 'age_ms > self.max_age_ms' services/camera_v11/step4_reid_scheduler_v1.py
          grep -Fq 'identity_mode=camera-tracklet-shadow+room-shadow+handoff-shadow-no-merge' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'max_per_camera_update=' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'predicted=skip' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'merge=0' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'identity_merge=0' services/camera_v11/step4_tracking_reid_v1.py
          ! grep -Fq 'embed_crops(' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'client.embed_crops' services/camera_v11/step4_reid_scheduler_v1.py
      - name: Single-camera reassociation invariants
        run: |
          grep -Fq 'class V11CameraTrackletShadowV1' services/camera_v11/step4_camera_tracklet_v1.py
          grep -Fq 'join_similarity: float = 0.80' services/camera_v11/step4_camera_tracklet_v1.py
          grep -Fq 'high_similarity: float = 0.90' services/camera_v11/step4_camera_tracklet_v1.py
          grep -Fq 'max_reassoc_gap_sec: float = 6.0' services/camera_v11/step4_camera_tracklet_v1.py
          grep -Fq 'def _bbox_center_distance' services/camera_v11/step4_camera_tracklet_v1.py
          grep -Fq 'if identity.active:' services/camera_v11/step4_camera_tracklet_v1.py
          grep -Fq 'center_distance <= self.max_center_distance' services/camera_v11/step4_camera_tracklet_v1.py
          grep -Fq 'V11CameraTrackletShadowV1' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'CAMERA_V11_STEP4_CAMERA_IDENTITY' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'camera_decision = self.camera_tracklet_shadow.observe' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'track_id=camera_identity' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'single_camera_reassoc=before-room' services/camera_v11/step4_tracking_reid_v1.py
      - name: Shadow room identity invariants
        run: |
          grep -Fq 'class V11RoomIdentityShadowV1' services/camera_v11/step4_room_identity_v1.py
          grep -Fq 'decision_samples: int = 6' services/camera_v11/step4_room_identity_v1.py
          grep -Fq 'weak_hold_similarity: float = 0.55' services/camera_v11/step4_room_identity_v1.py
          grep -Fq 'join_similarity: float = 0.76' services/camera_v11/step4_room_identity_v1.py
          grep -Fq 'PENDING_MATCH' services/camera_v11/step4_room_identity_v1.py
          grep -Fq 'def activity_snapshot' services/camera_v11/step4_room_identity_v1.py
          grep -Fq 'np.max(left_matrix @ right_matrix.T)' services/camera_v11/step4_room_identity_v1.py
          grep -Fq 'V11_STEP4_ROOM_DECISION_SAMPLES' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'CAMERA_V11_STEP4_ROOM_IDENTITY' services/camera_v11/step4_tracking_reid_v1.py
      - name: Shadow handoff lifecycle invariants
        run: |
          grep -Fq 'require_handoff_lifecycle: bool = False' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'recently_active_sec: float = 8.0' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'recently_lost_sec: float = 30.0' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'def update_track_activity' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'if left.active == right.active' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'lifecycle_rejects' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'require_handoff_lifecycle=True' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'def _sync_camera_identity_activity' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'def _sync_room_identity_activity' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'handoff_lifecycle=active-to-recently-lost' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'lifecycle_reject=' services/camera_v11/step4_tracking_reid_v1.py
      - name: Shadow handoff safety invariants
        run: |
          grep -Fq 'min_gallery_samples: int = 3' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'candidate_votes: int = 2' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'strong_votes: int = 3' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'min_cross_room_gap_sec: float = 1.5' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'allowed_room_transitions' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'reverse_ranked' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'reciprocal = bool' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'best_peer_streak' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'reciprocal_best=required' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'direct_room_neighbor=required' services/camera_v11/step4_tracking_reid_v1.py
      - name: Gallery similarity calibration guard
        run: |
          grep -Fq 'def _gallery_similarity' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'np.max(left_matrix @ right_matrix.T)' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'prototype_score' services/camera_v11/step4_identity_shadow_v1.py
          grep -Fq 'similarity=gallery-max prototype=telemetry' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'CAMERA_V11_STEP4_REID_CROSSROOM_PROBE' services/camera_v11/step4_tracking_reid_v1.py
          grep -Fq 'crossroom_probe=' services/camera_v11/step4_tracking_reid_v1.py
      - name: Room graph config guard
        run: |
          grep -Fq 'reid_topology:' config/cameras.yaml
          grep -Fq 'room_neighbors:' config/cameras.yaml
          grep -Fq 'Entrance:' config/cameras.yaml
          grep -Fq -- '- Devs' config/cameras.yaml
          grep -Fq -- '- Main Rooms' config/cameras.yaml
          grep -Fq '_camera_layout()' services/camera_v11/step4_tracking_reid_v1.py
      - name: Frozen Step3 guard
        run: |
          git diff --exit-code d2c9e62f9ed2b5f80dc9a4d496e0fda94afddc51 -- \
            services/camera_v11/step1_cam02_lowlat_v7.py \
            services/camera_v11/step1_independent_egl_v4.py \
            services/camera_v11/step2_production_fp32.py \
            services/camera_v11/step2_production_fp32_v12.py \
            services/camera_v11/step2_production_fp32_v13.py \
            services/camera_v11/step2_production_fp32_v18.py \
            services/camera_v11/step2_trt86.py \
            services/camera_v11/step3_tracker_v2.py \
            services/camera_v11/step3_tracking_v2.py \
            scripts/run_camera_v11_step3_tracker_v2.sh \
            scripts/check_camera_v11_step3_tracker_v2_log.py
      - name: Hot path invariants
        run: |
          grep -q 'execute_async_v2' scripts/reid_trt86_worker_v11.py
          grep -q 'cudaStreamSynchronize' scripts/reid_trt86_worker_v11.py
          ! grep -q 'cudaDeviceSynchronize' scripts/reid_trt86_worker_v11.py
          ! grep -q 'base64' services/camera_v11/step4_reid_trt86.py
          ! grep -q 'imencode' services/camera_v11/step4_reid_trt86.py
          ! grep -q 'base64' services/camera_v11/step4_reid_scheduler_v1.py
          ! grep -q 'imencode' services/camera_v11/step4_reid_scheduler_v1.py
          grep -q 'shared_memory.SharedMemory' services/camera_v11/step4_reid_trt86.py
