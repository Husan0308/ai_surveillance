name: Camera V11 Step4 ReID V1 Static

on:
  push:
    branches:
      - rebuild/service-architecture-v11-clean-step4-crosscamera-reid-v1-20260828

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile Step4 Python
        run: |
          python -m py_compile \
            services/camera_v11/step4_reid_trt86.py \
            scripts/reid_trt86_worker_v11.py \
            scripts/benchmark_camera_v11_step4_reid_v1.py
      - name: Frozen Step3 guard
        run: |
          git diff --exit-code d2c9e62f9ed2b5f80dc9a4d496e0fda94afddc51 -- \
            services/camera_v11/step1_cam02_lowlat_v7.py \
            services/camera_v11/step1_independent_egl_v4.py \
            services/camera_v11/step2_production_fp32.py \
            services/camera_v11/step2_production_fp32_v12.py \
            services/camera_v11/step2_production_fp32_v13.py \
            services/camera_v11/step2_production_fp32_v18.py \
            services/camera_v11/step2_trt86.py \
            services/camera_v11/step3_tracker_v2.py \
            services/camera_v11/step3_tracking_v2.py \
            scripts/run_camera_v11_step3_tracker_v2.sh \
            scripts/check_camera_v11_step3_tracker_v2_log.py
      - name: Hot path invariants
        run: |
          grep -q 'execute_async_v2' scripts/reid_trt86_worker_v11.py
          grep -q 'cudaStreamSynchronize' scripts/reid_trt86_worker_v11.py
          ! grep -q 'cudaDeviceSynchronize' scripts/reid_trt86_worker_v11.py
          ! grep -q 'base64' services/camera_v11/step4_reid_trt86.py
          ! grep -q 'imencode' services/camera_v11/step4_reid_trt86.py
          grep -q 'shared_memory.SharedMemory' services/camera_v11/step4_reid_trt86.py
