name: Camera V2 Restored TRT86 Stable Static

on:
  push:
    branches:
      - restore/stable-nvdcf-globalid-20260826
  pull_request:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m py_compile \
            services/camera_v2/person_tracking_trt86_restore_stable.py \
            services/camera_v2/person_tracking_trt86_reid_restore_stable.py \
            services/camera_v2/person_tracking_trt86_fresh.py \
            services/camera_v2/person_tracking_trt86_audited.py \
            services/camera_v2/person_tracking_pascal_trt86.py \
            services/camera_v2/tracker_profile.py \
            services/camera_v2/yolo_trt86_shm_bridge.py \
            services/camera_v2/yolo_trt86_fresh_bridge.py \
            scripts/yolo26_trt86_shm_worker.py
      - name: Shell syntax
        run: |
          bash -n scripts/run_restore_stable_tracking.sh
          bash -n scripts/run_restore_stable_globalid.sh
      - name: Architecture contract
        run: |
          grep -q 'CAMERA_V2_MICRO_BATCH=1' scripts/run_restore_stable_tracking.sh
          grep -q 'CAMERA_V2_FRAME_WIDTH:-960' scripts/run_restore_stable_tracking.sh
          grep -q 'CAMERA_V2_FRAME_HEIGHT:-540' scripts/run_restore_stable_tracking.sh
          grep -q 'CAMERA_V2_DETECT_TARGET_HZ:-0.24' scripts/run_restore_stable_tracking.sh
          grep -q 'CAMERA_V2_DETECT_MIN_HZ:-0.12' scripts/run_restore_stable_tracking.sh
          grep -q 'CAMERA_V2_TRACKER_WIDTH:-480' scripts/run_restore_stable_tracking.sh
          grep -q 'yolo26s-672x384-b1-fp32-trt86.engine' scripts/run_restore_stable_tracking.sh
          grep -q 'person_tracking_trt86_restore_stable' scripts/run_restore_stable_tracking.sh
          grep -q 'RESTORE_STABLE_OSD path=wall_queue->nvdsosd->EGL' services/camera_v2/person_tracking_trt86_restore_stable.py
          grep -q 'rgba_wall_convert=0' services/camera_v2/person_tracking_trt86_restore_stable.py
          grep -q 'scaled = self._scaled_detections(rows)' services/camera_v2/person_tracking_trt86_restore_stable.py
          grep -q 'output.append((x1, y1, x2, y2, float(conf)))' services/camera_v2/person_tracking_trt86_restore_stable.py
          ! grep -q 'return self._scaled_detections(rows)' services/camera_v2/person_tracking_trt86_restore_stable.py
          grep -q 'minIouDiff4NewTarget", "0.72"' services/camera_v2/person_tracking_trt86_restore_stable.py
          grep -q 'maxShadowTrackingAge", "100"' services/camera_v2/person_tracking_trt86_restore_stable.py
          grep -q 'minIou4TargetDuplicate", "0.90"' services/camera_v2/person_tracking_trt86_restore_stable.py
          grep -q 'useHog", "0"' services/camera_v2/person_tracking_trt86_restore_stable.py
          grep -q 'featureImgSizeLevel", "2"' services/camera_v2/person_tracking_trt86_restore_stable.py
          grep -q '"useHog": "0"' services/camera_v2/tracker_profile.py
          grep -q '"useColorNames": "1"' services/camera_v2/tracker_profile.py
          grep -q '"featureImgSizeLevel": "2"' services/camera_v2/tracker_profile.py
          grep -q 'execute_async_v2' scripts/yolo26_trt86_shm_worker.py
          grep -q 'cudaStreamCreateWithFlags' scripts/yolo26_trt86_shm_worker.py
          grep -q 'cudaStreamSynchronize' scripts/yolo26_trt86_shm_worker.py
          ! grep -q 'cudaDeviceSynchronize' scripts/yolo26_trt86_shm_worker.py
          grep -q 'CameraPersonTrackingReID' services/camera_v2/person_tracking_trt86_reid_restore_stable.py
          ! grep -q 'yolo26m.pt' scripts/run_restore_stable_tracking.sh
          ! grep -q 'MICRO_BATCH=2' scripts/run_restore_stable_tracking.sh
      - name: Detector tuple contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          p = Path('services/camera_v2/person_tracking_trt86_restore_stable.py')
          text_all = p.read_text()
          tree = ast.parse(text_all)
          cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'CameraPersonTrackingTRT86RestoreStable')
          fn = next(n for n in cls.body if isinstance(n, ast.FunctionDef) and n.name == '_dedup_and_expand')
          text = ast.get_source_segment(text_all, fn) or ''
          assert 'scaled = self._scaled_detections(rows)' in text
          assert 'output.append((x1, y1, x2, y2, float(conf)))' in text
          assert 'return self._scaled_detections(rows)' not in text
          print('RESTORE_STABLE_TUPLE_CONTRACT status=OK shape=(x1,y1,x2,y2,conf)')
          PY
