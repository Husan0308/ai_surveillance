name: Camera V2 Pascal TRT86 Static

on:
  push:
    branches:
      - fix/pascal-trt86-hybrid-20260826
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -m py_compile \
            services/camera_v2/person_tracking_pascal_trt86.py \
            services/camera_v2/pascal_runtime.py \
            services/camera_v2/person_tracking_trt86_audited.py \
            services/camera_v2/person_tracking_trt86_fresh.py \
            services/camera_v2/yolo_trt86_shm_bridge.py \
            scripts/yolo26_trt86_shm_worker_v3.py
      - name: Bash syntax
        run: bash -n scripts/run_camera_v2_pascal_trt86.sh
      - name: Pascal architecture contract
        run: |
          grep -q 'nvinfer=0 trt10=0' scripts/run_camera_v2_pascal_trt86.sh
          grep -q 'TensorRT 8.6.1 required' scripts/run_camera_v2_pascal_trt86.sh
          grep -q 'CAM-01,CAM-02,CAM-03,CAM-04,CAM-05,CAM-06' scripts/run_camera_v2_pascal_trt86.sh
          grep -q 'CAMERA_V2_DETECT_TARGET_HZ:-0.50' scripts/run_camera_v2_pascal_trt86.sh
          grep -q 'probationAge", "0"' services/camera_v2/person_tracking_pascal_trt86.py
          grep -q 'maxShadowTrackingAge", "80"' services/camera_v2/person_tracking_pascal_trt86.py
          grep -q 'rtsp-reconnect-attempts", 3' services/camera_v2/person_tracking_pascal_trt86.py
          grep -q 'PASCAL_PIPELINE_AUDIT' services/camera_v2/person_tracking_pascal_trt86.py
          grep -q 'source->tee linked' services/camera_v2/pascal_runtime.py
          grep -q 'frame\[:3' scripts/yolo26_trt86_shm_worker_v3.py
          grep -q 'frame\[381:' scripts/yolo26_trt86_shm_worker_v3.py
          ! grep -q 'person_tracking_native_deepstream' scripts/run_camera_v2_pascal_trt86.sh
