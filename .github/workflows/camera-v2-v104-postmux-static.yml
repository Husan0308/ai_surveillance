name: Camera V2 V10.4 Post-Mux Gate Static

on:
  push:
    branches:
      - rebuild/service-architecture-step4-v100-tracker-timeout40-20260827
    paths:
      - services/camera_v2/runtime_v104_postmux_gate.py
      - scripts/run_camera_v2_bbox_v104.sh
      - scripts/check_camera_v2_bbox_v104_log.py
      - .github/workflows/camera-v2-v104-postmux-static.yml
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile Python
        run: |
          python -m py_compile \
            services/camera_v2/runtime_v104_postmux_gate.py \
            scripts/check_camera_v2_bbox_v104_log.py
      - name: Shell syntax
        run: bash -n scripts/run_camera_v2_bbox_v104.sh
      - name: Guard post-mux policy
        run: |
          grep -q 'runtime_v101_tracker_batch_audit' services/camera_v2/runtime_v104_postmux_gate.py
          grep -q 'return self.Gst.PadProbeReturn.OK' services/camera_v2/runtime_v104_postmux_gate.py
          grep -q 'batched-push-timeout", 60_000' services/camera_v2/runtime_v104_postmux_gate.py
          grep -q 'pre_mux_gate=off post_mux_gate=10Hz batch_size=6 timeout_us=60000 sync_inputs=0' scripts/run_camera_v2_bbox_v104.sh
