name: camera-v11-step2-mixedprecision-v10-static

on:
  push:
    branches:
      - rebuild/service-architecture-v11-clean-step2-mixedprecision-v10-20260828
    paths:
      - 'scripts/inspect_yolo26s_trt86_layers.py'
      - 'scripts/build_yolo26s_b1_mixed_trt86.py'
      - 'scripts/sweep_camera_v11_trt86_person_conf.py'
      - 'scripts/prepare_coco_v11_final_person_holdout.py'
      - 'scripts/diagnose_camera_v11_trt86_output_drift.py'
      - 'scripts/trace_yolo26s_trt86_score_sources.py'
      - '.github/workflows/camera-v11-step2-mixedprecision-v10-static.yml'
  pull_request:
    paths:
      - 'scripts/inspect_yolo26s_trt86_layers.py'
      - 'scripts/build_yolo26s_b1_mixed_trt86.py'
      - 'scripts/sweep_camera_v11_trt86_person_conf.py'
      - 'scripts/prepare_coco_v11_final_person_holdout.py'
      - 'scripts/diagnose_camera_v11_trt86_output_drift.py'
      - 'scripts/trace_yolo26s_trt86_score_sources.py'

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python -m py_compile \
            scripts/inspect_yolo26s_trt86_layers.py \
            scripts/build_yolo26s_b1_mixed_trt86.py \
            scripts/sweep_camera_v11_trt86_person_conf.py \
            scripts/prepare_coco_v11_final_person_holdout.py \
            scripts/diagnose_camera_v11_trt86_output_drift.py \
            scripts/trace_yolo26s_trt86_score_sources.py
      - name: Mixed precision invariants
        run: |
          grep -F 'V11_LAYER_INSPECT_RESULT status=PASS' scripts/inspect_yolo26s_trt86_layers.py >/dev/null
          grep -F 'HEAD_START_DEFAULT = 308' scripts/build_yolo26s_b1_mixed_trt86.py >/dev/null
          grep -F 'BuilderFlag.INT8' scripts/build_yolo26s_b1_mixed_trt86.py >/dev/null
          grep -F 'BuilderFlag.OBEY_PRECISION_CONSTRAINTS' scripts/build_yolo26s_b1_mixed_trt86.py >/dev/null
          grep -F 'layer.precision = trt.float32' scripts/build_yolo26s_b1_mixed_trt86.py >/dev/null
          grep -F 'layer.set_output_type(out_idx, trt.float32)' scripts/build_yolo26s_b1_mixed_trt86.py >/dev/null
          grep -F 'V11_MIXED_BUILD_RESULT' scripts/build_yolo26s_b1_mixed_trt86.py >/dev/null
          grep -F 'V11_CONF_SWEEP_BEST status=PASS' scripts/sweep_camera_v11_trt86_person_conf.py >/dev/null
          grep -F 'diagnostic=1' scripts/sweep_camera_v11_trt86_person_conf.py >/dev/null
          grep -F 'overlap_quality=0 overlap_calibration=0' scripts/prepare_coco_v11_final_person_holdout.py >/dev/null
          grep -F 'V11_FINAL_HOLDOUT_RESULT' scripts/prepare_coco_v11_final_person_holdout.py >/dev/null
          grep -F 'score_loss=' scripts/diagnose_camera_v11_trt86_output_drift.py >/dev/null
          grep -F 'geometry_loss=' scripts/diagnose_camera_v11_trt86_output_drift.py >/dev/null
          grep -F 'V11_OUTPUT_DRIFT_DONE status=PASS' scripts/diagnose_camera_v11_trt86_output_drift.py >/dev/null
          grep -F 'discovery=graph_edges' scripts/trace_yolo26s_trt86_score_sources.py >/dev/null
          grep -F 'V11_SCORE_PATH_RESULT status=PASS' scripts/trace_yolo26s_trt86_score_sources.py >/dev/null
