name: Sentinel Camera Wall Static

on:
  push:
    branches:
      - agent/rfdetr-s-core-final
  pull_request:
    paths:
      - 'services/camera_v2/camera_wall_runtime.py'
      - 'services/camera_v2/pascal_safe_pipeline.py'
      - 'services/camera_v2/rfdetr_backend.py'
      - 'services/camera_v2/detection.py'
      - 'services/camera_v2/dynamic_wall.py'
      - 'services/camera_v2/main.py'
      - 'services/camera_v2/sentinel_ui.py'
      - 'services/camera_v2/sentinel_ui_monitoring_native.py'
      - 'scripts/preflight_rfdetr_core.py'
      - 'scripts/preflight_pascal_safe.py'
      - 'scripts/preflight_sentinel_ui.py'
      - 'scripts/preflight_camera_v2_core.py'
      - 'scripts/run_sentinel_vms.sh'
      - 'tests/test_camera_v2_rfdetr_core.py'
      - 'tests/test_camera_v2_native_presentation.py'
      - '.github/workflows/sentinel-ui-static.yml'

jobs:
  static-camera-wall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile active Python sources
        run: |
          python -m py_compile \
            services/camera_v2/camera_wall_runtime.py \
            services/camera_v2/pascal_safe_pipeline.py \
            services/camera_v2/rfdetr_backend.py \
            services/camera_v2/detection.py \
            services/camera_v2/dynamic_wall.py \
            services/camera_v2/main.py \
            services/camera_v2/sentinel_ui.py \
            services/camera_v2/sentinel_ui_monitoring_native.py \
            scripts/preflight_rfdetr_core.py \
            scripts/preflight_pascal_safe.py \
            scripts/preflight_sentinel_ui.py \
            scripts/preflight_camera_v2_core.py \
            tests/test_camera_v2_rfdetr_core.py \
            tests/test_camera_v2_native_presentation.py

      - name: Enforce active architecture contract
        run: |
          python - <<'PY'
          from pathlib import Path

          pascal = Path('services/camera_v2/pascal_safe_pipeline.py').read_text()
          controller = Path('services/camera_v2/camera_wall_runtime.py').read_text()
          ui = Path('services/camera_v2/sentinel_ui_monitoring_native.py').read_text()
          shell = Path('services/camera_v2/sentinel_ui.py').read_text()
          launcher = Path('scripts/run_sentinel_vms.sh').read_text()

          assert 'class CameraPascalSafeRuntime(CameraDetectionV2)' in pascal
          assert 'self.wall_queue.unlink(self.sink)' in pascal
          assert 'mapped_size' in pascal and 'row_stride' in pascal
          assert 'safe_mux_batches' in pascal and 'safe_wall_frames' in pascal
          for forbidden in (
              'CameraPersonTrackingV2',
              'CameraPersonTrackingFinal',
              'libnvds_nvmultiobjecttracker',
              'config_tracker_NvDCF',
          ):
              assert forbidden not in pascal, forbidden

          assert 'from .pascal_safe_pipeline import CameraPascalSafeRuntime' in controller
          assert 'if target == bound_xid' in controller
          assert 'GstVideo.VideoOverlay.set_window_handle' in controller
          assert 'from .camera_wall_runtime import CameraWallController' in ui
          assert 'ProPipelineController' not in ui
          assert 'BUILD_TAG = "2026.08.20-r16-pascal-safe"' in shell
          assert 'export CAMERA_V2_PASCAL_SAFE=1' in launcher
          assert 'nvtracker=disabled' in launcher
          print('SENTINEL_CAMERA_WALL_STATIC=PASS')
          PY
