name: Sentinel Camera Wall Static

on:
  push:
    branches:
      - agent/rfdetr-s-core-final
  pull_request:
    paths:
      - 'services/camera_v2/camera_wall_runtime.py'
      - 'services/camera_v2/pascal_safe_pipeline.py'
      - 'services/camera_v2/rfdetr_backend.py'
      - 'services/camera_v2/detection.py'
      - 'services/camera_v2/dynamic_wall.py'
      - 'services/camera_v2/main.py'
      - 'services/camera_v2/secure.py'
      - 'services/camera_v2/sentinel_ui.py'
      - 'services/camera_v2/sentinel_ui_monitoring_native.py'
      - 'scripts/preflight_rfdetr_core.py'
      - 'scripts/preflight_pascal_safe.py'
      - 'scripts/preflight_sentinel_ui.py'
      - 'scripts/preflight_camera_v2_core.py'
      - 'scripts/run_sentinel_vms.sh'
      - 'tests/test_camera_v2_rfdetr_core.py'
      - 'tests/test_camera_v2_native_presentation.py'
      - '.github/workflows/sentinel-ui-static.yml'

jobs:
  static-camera-wall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile active Python sources
        run: |
          python -m py_compile \
            services/camera_v2/camera_wall_runtime.py \
            services/camera_v2/pascal_safe_pipeline.py \
            services/camera_v2/rfdetr_backend.py \
            services/camera_v2/detection.py \
            services/camera_v2/dynamic_wall.py \
            services/camera_v2/main.py \
            services/camera_v2/secure.py \
            services/camera_v2/sentinel_ui.py \
            services/camera_v2/sentinel_ui_monitoring_native.py \
            scripts/preflight_rfdetr_core.py \
            scripts/preflight_pascal_safe.py \
            scripts/preflight_sentinel_ui.py \
            scripts/preflight_camera_v2_core.py \
            tests/test_camera_v2_rfdetr_core.py \
            tests/test_camera_v2_native_presentation.py

      - name: Enforce active architecture contract
        run: |
          python - <<'PY'
          from pathlib import Path

          pascal = Path('services/camera_v2/pascal_safe_pipeline.py').read_text()
          controller = Path('services/camera_v2/camera_wall_runtime.py').read_text()
          secure = Path('services/camera_v2/secure.py').read_text()
          ui = Path('services/camera_v2/sentinel_ui_monitoring_native.py').read_text()
          shell = Path('services/camera_v2/sentinel_ui.py').read_text()
          launcher = Path('scripts/run_sentinel_vms.sh').read_text()

          assert 'class CameraPascalSafeRuntime(CameraDetectionV2)' in pascal
          assert 'SecureCameraWallV2._add_camera(self, index, camera)' in pascal
          assert 'def _install_postmux_inference(self)' in pascal
          assert 'pascal_postmux_tee' in pascal
          assert 'nvstreamdemux' in pascal
          assert 'CAMERA_DETECT_PATH mode=postmux-demux' in pascal
          assert 'source_path=direct-to-nvstreammux' in pascal
          assert 'safe_mux_batches' in pascal
          assert 'safe_wall_frames' in pascal
          assert 'safe_sink_buffers' in pascal
          assert 'CAMERA_STARTUP_STALL' in pascal
          for forbidden in (
              'CameraPersonTrackingV2',
              'CameraPersonTrackingFinal',
              'libnvds_nvmultiobjecttracker',
              'config_tracker_NvDCF',
          ):
              assert forbidden not in pascal, forbidden

          assert 'CAMERA_V2_RTSP_TRANSPORT' in secure
          assert 'select-rtp-protocol' in secure
          assert 'self._set_if(element, "protocols", 4)' in secure
          assert 'def _source_pad_added' in secure
          assert 'caps.is_any()' in secure

          assert 'def set_focus(source_id: int)' in controller
          assert 'runtime.tiler.set_property("show-source", sid)' in controller
          assert 'def focus(self, source_id: int)' in controller
          assert 'if target == bound_xid' in controller
          assert 'GstVideo.VideoOverlay.set_window_handle' in controller
          assert 'cameraClicked = Signal(int)' in ui
          assert 'def _grid_source_at' in ui
          assert 'window.showFullScreen()' in ui
          assert 'window.showMaximized()' in ui
          assert 'BUILD_TAG = "2026.08.20-r18-rtsp-tcp"' in shell
          assert 'export CAMERA_V2_RTSP_TRANSPORT=tcp' in launcher
          assert 'export CAMERA_V2_RTSP_LATENCY_MS=250' in launcher
          assert 'rtsp=tcp latency=250ms' in launcher
          assert 'export CAMERA_V2_PASCAL_SAFE=1' in launcher
          assert 'detector_path=postmux-demux' in launcher
          assert 'ui=camera-only-2x3-click-fullscreen' in launcher
          assert 'nvtracker=disabled' in launcher
          print('SENTINEL_CAMERA_WALL_STATIC=PASS')
          PY
