name: Sentinel UI Static

on:
  push:
    branches: [rebuild/gpu-v2-clean, agent/production-runtime-cleanup]
  pull_request:
    paths:
      - 'services/camera_v2/**'
      - 'scripts/preflight_sentinel_ui.py'
      - 'scripts/preflight_camera_v2_core.py'
      - 'scripts/run_sentinel_vms.sh'
      - 'config/cameras.yaml'
      - '.github/workflows/sentinel-ui-static.yml'

jobs:
  static-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile production Python sources
        run: |
          python -m py_compile \
            services/camera_v2/config.py \
            services/camera_v2/sentinel_ui.py \
            services/camera_v2/sentinel_ui_base.py \
            services/camera_v2/sentinel_ui_monitoring.py \
            services/camera_v2/sentinel_ui_settings.py \
            services/camera_v2/sentinel_ui_enrollment.py \
            services/camera_v2/sentinel_ui_pages.py \
            services/camera_v2/sentinel_store.py \
            services/camera_v2/sentinel_video.py \
            services/camera_v2/sentinel_video_pro.py \
            services/camera_v2/sentinel_video_wall_ui.py \
            services/camera_v2/detection.py \
            services/camera_v2/person_tracking.py \
            services/camera_v2/person_tracking_final.py \
            services/camera_v2/person_tracking_heatmap.py \
            scripts/preflight_sentinel_ui.py \
            scripts/preflight_camera_v2_core.py

      - name: Enforce production contract
        run: |
          python - <<'PY'
          from pathlib import Path

          shell = Path('services/camera_v2/sentinel_ui.py').read_text()
          monitoring = Path('services/camera_v2/sentinel_ui_monitoring.py').read_text()
          settings = Path('services/camera_v2/sentinel_ui_settings.py').read_text()
          wall = Path('services/camera_v2/sentinel_video_wall_ui.py').read_text()
          video = Path('services/camera_v2/sentinel_video_pro.py').read_text()
          tracker = Path('services/camera_v2/person_tracking_final.py').read_text()
          heatmap = Path('services/camera_v2/person_tracking_heatmap.py').read_text()
          camera_config = Path('config/cameras.yaml').read_text()

          for source in (shell, monitoring, settings, wall):
              for text in ('NVDEC', 'no pose/reid', 'pose=', 'reid=', 'DeepStream'):
                  assert text not in source, f'technical UI label returned: {text}'

          for text in ('Environment URI', 'self.env_uri =', 'self.codec =', 'form.addRow("Codec"'):
              assert text not in settings, f'stale Settings field: {text}'

          assert 'BUILD_TAG = "2026.08.19-r11"' in shell
          assert 'metrics.get("total_people"' in monitoring
          assert 'metrics.get("known_people"' in monitoring
          assert 'unknown = max(0, total - known)' in monitoring
          assert 'live_source_counts' in tracker
          assert 'source_track_counts' in tracker
          assert 'room_people[room_key] = max' in video
          assert 'total = sum(room_people.values())' in video
          assert 'known = 0' in video
          assert 'unknown = total' in video
          assert 'self.bridge.heatmap_update(buffer)' in heatmap
          assert 'PoseHeatmapBridge' not in heatmap

          for forbidden in ('\n    codec:', '\n    env_uri:', '\n    environment_uri:'):
              assert forbidden not in camera_config, f'stale camera config field: {forbidden.strip()}'

          for removed in (
              'services/camera_v2/data.py',
              'services/camera_v2/sentinel_exact.py',
              'services/camera_v2/sentinel_app.py',
              'services/camera_v2/monitor_ui_reference.py',
          ):
              assert not Path(removed).exists(), f'legacy production file returned: {removed}'

          print('SENTINEL_UI_STATIC=PASS')
          PY
