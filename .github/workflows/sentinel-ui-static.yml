name: Sentinel UI Static

on:
  push:
    branches: [rebuild/gpu-v2-clean, agent/production-runtime-cleanup]
  pull_request:
    paths:
      - 'services/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config/cameras.yaml'
      - 'requirements.txt'
      - '.github/workflows/sentinel-ui-static.yml'

jobs:
  static-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight test dependencies
        run: python -m pip install PyYAML python-dotenv ruff

      - name: Compile all retained Python sources
        run: python -m compileall -q services scripts tests

      - name: Scan for critical Python bugs
        run: ruff check services scripts tests --select E9,F63,F7,F82

      - name: Run config and persistence unit tests
        run: python -m unittest discover -s tests -v

      - name: Enforce production contract
        run: |
          python - <<'PY'
          from pathlib import Path

          shell = Path('services/camera_v2/sentinel_ui.py').read_text()
          monitoring = Path('services/camera_v2/sentinel_ui_monitoring.py').read_text()
          base_video = Path('services/camera_v2/sentinel_video.py').read_text()
          wall = Path('services/camera_v2/sentinel_video_wall_ui.py').read_text()
          launcher = Path('scripts/run_sentinel_vms.sh').read_text()
          tracker = Path('services/camera_v2/person_tracking_final.py').read_text()

          assert 'BUILD_TAG = "2026.08.19-r12"' in shell
          assert 'QLabel("Estimated people")' in monitoring
          assert 'class _GstVideoSurface(QWidget)' in base_video
          assert 'self.setObjectName("gstVideoSurface")' in base_video
          assert 'self.video_surface = _GstVideoSurface(self)' in base_video
          assert 'def video_window_id(self)' in base_video
          assert 'def winId(self)' in base_video
          assert 'return self.video_surface.winId()' in base_video
          assert 'self.video_surface.lower()' in base_video

          assert 'class ProPipelineController(_BaseProPipelineController)' in wall
          assert 'self.command_q.put_nowait(("focus", -1))' in wall
          assert 'header.setAttribute(Qt.WA_NativeWindow, True)' in wall
          assert 'cam.setParent(header)' in wall
          assert 'stat.setParent(header)' in wall
          assert 'frame.setAttribute(Qt.WA_NativeWindow, True)' in wall
          assert 'left + width - actions.width() - 8' in wall
          assert 'top + 34' in wall
          assert 'top + height - actions.height()' not in wall

          assert 'export CAMERA_V2_TILER_COLUMNS=2' in launcher
          assert 'export CAMERA_V2_WALL_WIDTH=1600' in launcher
          assert 'export CAMERA_V2_WALL_HEIGHT=1350' in launcher
          assert 'live_source_counts' in tracker
          assert 'source_track_counts' in tracker

          for path in [*Path('services').rglob('*.py'), *Path('scripts').rglob('*.py'), *Path('tests').rglob('*.py')]:
              source = path.read_text(encoding='utf-8')
              assert 'services.ml_service' not in source, f'legacy ml_service import remains: {path}'

          for removed in (
              'services/camera_v2/data.py',
              'services/camera_v2/sentinel_app.py',
              'services/camera_v2/monitor_ui_reference.py',
              'services/camera_v2/qwen_reid.py',
              'services/camera_v2/reid_runtime.py',
              'services/api_service',
              'services/frontend',
              'services/ml_service',
          ):
              assert not Path(removed).exists(), f'legacy production path returned: {removed}'

          print('SENTINEL_UI_STATIC=PASS')
          PY
