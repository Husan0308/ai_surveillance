name: Camera V2 V9.8 Tracker Pool Static

on:
  push:
    branches:
      - rebuild/service-architecture-step4-v98-tracker-pool-20260827
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile V9.8 files
        run: |
          python -m py_compile services/camera_v2/runtime_v98_tracker_pool.py
          python -m py_compile scripts/check_camera_v2_bbox_v98_log.py
          bash -n scripts/run_camera_v2_bbox_v98.sh
      - name: Guard one-variable A/B
        run: |
          grep -q 'buffer-pool-size", 4' services/camera_v2/runtime_v98_tracker_pool.py
          grep -q 'runtime_v97_display_pool' services/camera_v2/runtime_v98_tracker_pool.py
          grep -q 'only_change=tracker-mux-buffer-pool' services/camera_v2/runtime_v98_tracker_pool.py
