name: Camera V2 V10.3 Shared Phase Static

on:
  push:
    branches:
      - rebuild/service-architecture-step4-v100-tracker-timeout40-20260827
    paths:
      - services/camera_v2/runtime_v103_shared_phase_gate.py
      - scripts/run_camera_v2_bbox_v103.sh
      - scripts/check_camera_v2_bbox_v103_log.py
      - .github/workflows/camera-v2-v103-shared-phase-static.yml
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile Python
        run: |
          python -m py_compile \
            services/camera_v2/runtime_v103_shared_phase_gate.py \
            scripts/check_camera_v2_bbox_v103_log.py
      - name: Shell syntax
        run: bash -n scripts/run_camera_v2_bbox_v103.sh
      - name: Guard shared phase policy
        run: |
          grep -q 'runtime_v101_tracker_batch_audit' services/camera_v2/runtime_v103_shared_phase_gate.py
          grep -q 'slot = int(now / period_s)' services/camera_v2/runtime_v103_shared_phase_gate.py
          grep -q 'tracker_batch_size=' services/camera_v2/runtime_v103_shared_phase_gate.py
          grep -q 'batch_size=6 timeout_us=40000 sync_inputs=0' scripts/run_camera_v2_bbox_v103.sh
