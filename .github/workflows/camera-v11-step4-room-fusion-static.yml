name: Camera V11 Step4 Room Fusion Static

on:
  push:
    branches:
      - rebuild/service-architecture-v11-clean-step4-crosscamera-reid-v1-20260828

jobs:
  room-fusion-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile room fusion
        run: |
          python -m py_compile services/camera_v11/step4_room_identity_v1.py
      - name: Cross-camera-only room identity invariants
        run: |
          grep -Fq 'cross_camera_only: bool = True' services/camera_v11/step4_room_identity_v1.py
          grep -Fq 'require_active_overlap: bool = True' services/camera_v11/step4_room_identity_v1.py
          grep -Fq 'def _has_camera_member' services/camera_v11/step4_room_identity_v1.py
          grep -Fq 'if self.cross_camera_only and self._has_camera_member(identity, camera_id):' services/camera_v11/step4_room_identity_v1.py
          grep -Fq 'not incoming_active or not self._has_active_peer_camera(pending, identity)' services/camera_v11/step4_room_identity_v1.py
          grep -Fq 'single-camera stitching belongs to the camera' services/camera_v11/step4_room_identity_v1.py
          grep -Fq 'inactive_overlap_rejects' services/camera_v11/step4_room_identity_v1.py
      - name: Frozen Step3 guard
        run: |
          git diff --exit-code d2c9e62f9ed2b5f80dc9a4d496e0fda94afddc51 -- \
            services/camera_v11/step1_cam02_lowlat_v7.py \
            services/camera_v11/step1_independent_egl_v4.py \
            services/camera_v11/step2_production_fp32.py \
            services/camera_v11/step2_production_fp32_v12.py \
            services/camera_v11/step2_production_fp32_v13.py \
            services/camera_v11/step2_production_fp32_v18.py \
            services/camera_v11/step2_trt86.py \
            services/camera_v11/step3_tracker_v2.py \
            services/camera_v11/step3_tracking_v2.py \
            scripts/run_camera_v11_step3_tracker_v2.sh \
            scripts/check_camera_v11_step3_tracker_v2_log.py
