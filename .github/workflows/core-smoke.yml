name: Detection + tracking + ReID + smooth camera smoke tests

on:
  push:
    branches:
      - "agent/cross-camera-reid-global-id"
  pull_request:
    paths:
      - "services/ml_service/**"
      - "services/frontend/core_v1/**"
      - "config/core_v1.yaml"
      - "requirements/ml.txt"
      - "tests/**"
      - ".github/workflows/core-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke-test dependencies
        run: python -m pip install --upgrade pip numpy opencv-python-headless psutil pyyaml

      - name: Compile detection + tracking + ReID + camera runtime modules
        run: |
          python -m py_compile \
            services/ml_service/core_v1/__init__.py \
            services/ml_service/core_v1/app.py \
            services/ml_service/core_v1/camera_worker.py \
            services/ml_service/core_v1/latest_frame.py \
            services/ml_service/core_v1/manager.py \
            services/ml_service/core_v1/detector.py \
            services/ml_service/core_v1/stable_detector.py \
            services/ml_service/core_v1/visual_tracker.py \
            services/ml_service/core_v1/local_tracker.py \
            services/ml_service/core_v1/ownership_tracker.py \
            services/ml_service/core_v1/reid_embedder.py \
            services/ml_service/core_v1/global_reid.py \
            services/ml_service/core_v1/jpeg_publisher.py \
            services/ml_service/core_v1/event_publisher.py \
            services/ml_service/core_v1/tracking_publisher.py \
            services/ml_service/core_v1/runtime_metrics.py \
            services/ml_service/cameras/deepstream.py \
            services/ml_service/cameras/gstreamer.py \
            services/ml_service/cameras/smooth_gstreamer.py \
            services/frontend/core_v1/main.py \
            services/frontend/core_v1/dashboard.py \
            services/frontend/core_v1/smooth_frame_reader.py \
            services/frontend/core_v1/operator_dashboard.py \
            services/frontend/core_v1/operator_dashboard_v2.py \
            services/frontend/core_v1/operator_dashboard_detection.py

      - name: Test detector model resolution
        run: python -m unittest discover -s tests -p "test_stable_detector.py" -v

      - name: Test original visual tracker regressions
        run: python -m unittest discover -s tests -p "test_core_v1_visual_tracker.py" -v

      - name: Test JPEG publisher freshness
        run: python -m unittest discover -s tests -p "test_core_v1_jpeg_publisher.py" -v

      - name: Test Hungarian local tracking
        run: python -m unittest discover -s tests -p "test_local_tracking.py" -v

      - name: Test ID ownership lock
        run: python -m unittest discover -s tests -p "test_id_ownership.py" -v

      - name: Test cross-camera Global ID rules
        run: python -m unittest discover -s tests -p "test_global_reid.py" -v

      - name: Test smooth camera pipeline
        run: python -m unittest discover -s tests -p "test_camera_smoothness.py" -v

      - name: Test event-driven publisher
        run: python -m unittest discover -s tests -p "test_event_driven_publisher.py" -v

      - name: Test runtime architecture guards
        run: python -m unittest discover -s tests -p "test_detection_only_baseline.py" -v
