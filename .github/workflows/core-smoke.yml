name: Core smoke tests

on:
  push:
    branches:
      - "agent/yolo26m-pose-unified-cuda"
  pull_request:
    paths:
      - "services/ml_service/**"
      - "services/frontend/core_v1/heatmap_ui.py"
      - "config/core_v1.yaml"
      - "requirements/ml.txt"
      - "tests/**"
      - ".github/workflows/core-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install smoke-test dependencies
        run: python -m pip install --upgrade pip numpy opencv-python-headless
      - name: Compile modified runtime modules
        run: |
          python -m py_compile \
            services/ml_service/core_v1/unified_detector.py \
            services/ml_service/core_v1/app.py \
            services/frontend/core_v1/heatmap_ui.py \
            services/ml_service/heatmap/coordinator.py
      - name: Run pose and heatmap regression tests
        run: python -m unittest tests.test_floor_heatmap tests.test_unified_pose_worker -v
