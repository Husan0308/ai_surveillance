name: Camera V2 V8.7 Tracker480 Static

on:
  push:
    paths:
      - 'services/camera_v2/runtime_v87_tracker480.py'
      - 'scripts/run_camera_v2_bbox_v87.sh'
      - 'scripts/check_camera_v2_bbox_v87_log.py'
      - '.github/workflows/camera-v2-v87-tracker480-static.yml'
  pull_request:
    paths:
      - 'services/camera_v2/runtime_v87_tracker480.py'
      - 'scripts/run_camera_v2_bbox_v87.sh'
      - 'scripts/check_camera_v2_bbox_v87_log.py'

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python compile
        run: |
          python -m py_compile services/camera_v2/runtime_v87_tracker480.py scripts/check_camera_v2_bbox_v87_log.py
      - name: Shell syntax
        run: bash -n scripts/run_camera_v2_bbox_v87.sh
      - name: Guard single A/B scope
        run: |
          grep -q 'CAMERA_V2_TRACK_WIDTH=.*480' scripts/run_camera_v2_bbox_v87.sh
          grep -q 'CAMERA_V2_TRACK_HEIGHT=.*288' scripts/run_camera_v2_bbox_v87.sh
          grep -q 'CAMERA_V2_TRACK_FPS=.*8' scripts/run_camera_v2_bbox_v87.sh
          grep -q 'CAMERA_V85_NVDCF_FEATURE_LEVEL=.*1' scripts/run_camera_v2_bbox_v87.sh
          grep -q 'CAMERA_V84_DETECT_GPU_BUDGET=.*0.30' scripts/run_camera_v2_bbox_v87.sh
          grep -q 'unset NVDS_DISABLE_CUDADEV_BLOCKINGSYNC' scripts/run_camera_v2_bbox_v87.sh
          grep -q 'only_change=tracker-resolution-512x288-to-480x288' services/camera_v2/runtime_v87_tracker480.py
