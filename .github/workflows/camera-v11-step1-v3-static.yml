name: camera-v11-step1-v3-static

on:
  push:
    branches:
      - rebuild/service-architecture-v11-clean-step1-display-v3-20260827
  pull_request:
    paths:
      - 'services/camera_v11/step1_display_v3.py'
      - 'scripts/run_camera_v11_step1_v3.sh'
      - 'scripts/check_camera_v11_step1_v3_log.py'
      - '.github/workflows/camera-v11-step1-v3-static.yml'

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python -m py_compile services/camera_v11/step1_display_v3.py
          python -m py_compile scripts/check_camera_v11_step1_v3_log.py
      - name: Shell syntax
        run: bash -n scripts/run_camera_v11_step1_v3.sh
      - name: V3 architecture guards
        run: |
          grep -q '"sync-inputs", True' services/camera_v11/step1_display_v3.py
          grep -q 'V11_MUX_MAX_LATENCY_NS.*100000000' scripts/run_camera_v11_step1_v3.sh
          grep -q 'V11_BATCH_TIMEOUT_US.*40000' scripts/run_camera_v11_step1_v3.sh
          grep -q 'mux_age_p95' scripts/check_camera_v11_step1_v3_log.py
          grep -q 'display_age_p95' scripts/check_camera_v11_step1_v3_log.py
          ! grep -q 'tile_samples' scripts/check_camera_v11_step1_v3_log.py
