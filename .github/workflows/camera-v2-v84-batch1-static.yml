name: Camera V2 V8.4 Batch1 Static

on:
  push:
    branches:
      - rebuild/service-architecture-step4-v84-batch1-lowlatency-20260827
  pull_request:

jobs:
  v84-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile V8.4
        run: |
          python -m py_compile \
            services/camera_v2/runtime_v84_batch1.py \
            scripts/check_camera_v2_bbox_v84_log.py

      - name: Shell syntax
        run: bash -n scripts/run_camera_v2_bbox_v84.sh

      - name: Guard batch1 architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'yolo_trt86_shm_worker' services/camera_v2/runtime_v84_batch1.py
          grep -q 'batch1-roundrobin' services/camera_v2/runtime_v84_batch1.py
          grep -q 'cameras": \[cid\]' services/camera_v2/runtime_v84_batch1.py
          grep -q 'frames": \[frame\]' services/camera_v2/runtime_v84_batch1.py
          grep -q 'queue_depth=1' services/camera_v2/runtime_v84_batch1.py
          ! grep -q 'yolo_trt86_batch6_worker' services/camera_v2/runtime_v84_batch1.py
          ! grep -q 'for cid in ids:.*_request_capture' services/camera_v2/runtime_v84_batch1.py

      - name: Guard proven V8 tracker baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CAMERA_V2_TRACK_FPS=.*8' scripts/run_camera_v2_bbox_v84.sh
          grep -q 'CAMERA_V2_MIN_DISPLAY_TRACK_CONF=.*0.28' scripts/run_camera_v2_bbox_v84.sh
          grep -q 'CAMERA_V2_DISPLAY_EMPTY_HOLD_MS=.*350' scripts/run_camera_v2_bbox_v84.sh
          grep -q 'bbox_unchanged=1' scripts/run_camera_v2_bbox_v84.sh

      - name: Guard Pascal TRT8.6 batch1 engine
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'yolo26s-672x384-b1-fp32-trt86.engine' scripts/run_camera_v2_bbox_v84.sh
          grep -q '(1,3,384,672)' scripts/run_camera_v2_bbox_v84.sh
          grep -q '(1,300,6)' scripts/run_camera_v2_bbox_v84.sh
          grep -q 'CAMERA_V84_DETECT_GPU_BUDGET' scripts/run_camera_v2_bbox_v84.sh
