name: Camera V2 V10.7 CAM02 Latency Static

on:
  push:
    paths:
      - 'services/camera_v2/runtime_v107_cam02_latency120.py'
      - 'scripts/run_camera_v2_bbox_v107.sh'
      - 'scripts/check_camera_v2_bbox_v107_log.py'
      - '.github/workflows/camera-v2-v107-cam02-latency-static.yml'
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python -m py_compile \
            services/camera_v2/runtime_v107_cam02_latency120.py \
            scripts/check_camera_v2_bbox_v107_log.py
      - name: Shell syntax
        run: bash -n scripts/run_camera_v2_bbox_v107.sh
      - name: Guard one-variable policy
        run: |
          grep -q 'TARGET_CAMERA = "CAM-02"' services/camera_v2/runtime_v107_cam02_latency120.py
          grep -q 'TARGET_LATENCY_MS = 120' services/camera_v2/runtime_v107_cam02_latency120.py
          grep -q 'only_change=CAM-02-rtsp-latency-60-to-120' scripts/run_camera_v2_bbox_v107.sh
          grep -q 'tcp_timestamp_property=' scripts/run_camera_v2_bbox_v107.sh
