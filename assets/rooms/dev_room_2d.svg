<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
  <defs>
    <pattern id="floor" width="120" height="42" patternUnits="userSpaceOnUse">
      <rect width="120" height="42" fill="#9a6a3f"/>
      <path d="M0 1H120M0 41H120M60 1V41" stroke="#805733" stroke-width="1" opacity=".55"/>
    </pattern>
    <linearGradient id="desk" x1="0" x2="1">
      <stop offset="0" stop-color="#dfc6a0"/><stop offset="1" stop-color="#caa77a"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="1080" fill="#f4f2ed"/>
  <rect x="58" y="48" width="1324" height="984" rx="3" fill="#33383d"/>
  <rect x="86" y="76" width="1268" height="928" fill="url(#floor)"/>

  <!-- top wall + door -->
  <rect x="86" y="76" width="1268" height="28" fill="#d7d3cc"/>
  <rect x="790" y="55" width="128" height="120" fill="#744a2a" stroke="#412a18" stroke-width="8"/>
  <circle cx="895" cy="117" r="5" fill="#d8d8d8"/>
  <rect x="1190" y="89" width="108" height="35" rx="4" fill="#f4f5f5" stroke="#b8b8b8" stroke-width="3"/>

  <!-- curtain/window wall -->
  <g opacity=".95">
    <rect x="110" y="100" width="145" height="255" fill="#ead7b5"/>
    <rect x="270" y="100" width="145" height="245" fill="#ead7b5"/>
    <rect x="430" y="100" width="145" height="235" fill="#ead7b5"/>
    <rect x="590" y="100" width="120" height="220" fill="#ead7b5"/>
    <g stroke="#8d5a38" stroke-width="15" opacity=".85">
      <path d="M125 105V350M165 105V350M205 105V350M285 105V340M325 105V340M365 105V340M445 105V330M485 105V330M525 105V330M605 105V315M645 105V315M685 105V315"/>
    </g>
  </g>

  <!-- left L workstation -->
  <polygon points="120,820 120,600 180,600 180,530 225,530 225,455 275,455 275,375 330,375 330,300 390,300 390,255 505,255 555,310 455,360 420,420 370,470 335,535 295,595 255,675 220,770 220,900 120,900" fill="url(#desk)" stroke="#9a7b57" stroke-width="3"/>

  <!-- left monitors -->
  <g fill="#1e2329" stroke="#0d1115" stroke-width="4">
    <rect x="175" y="565" width="70" height="45" transform="rotate(-48 210 587)"/>
    <rect x="260" y="430" width="75" height="46" transform="rotate(-38 297 453)"/>
    <rect x="360" y="312" width="78" height="48" transform="rotate(-25 399 336)"/>
  </g>

  <!-- left chairs -->
  <g fill="#25282b" stroke="#111" stroke-width="4">
    <ellipse cx="286" cy="650" rx="42" ry="55" transform="rotate(-35 286 650)"/>
    <ellipse cx="405" cy="470" rx="42" ry="55" transform="rotate(-30 405 470)"/>
    <ellipse cx="485" cy="360" rx="40" ry="53" transform="rotate(-25 485 360)"/>
  </g>

  <!-- right workstation -->
  <polygon points="1130,210 1287,210 1287,920 1130,920 1130,820 1160,820 1160,705 1130,705 1130,570 1160,570 1160,450 1130,450" fill="url(#desk)" stroke="#9a7b57" stroke-width="3"/>
  <g fill="#20252a" stroke="#0d1115" stroke-width="4">
    <rect x="1205" y="250" width="55" height="78"/>
    <rect x="1200" y="590" width="62" height="95"/>
    <rect x="1205" y="755" width="57" height="90"/>
  </g>
  <rect x="1175" y="350" width="85" height="45" rx="6" fill="#e98025" stroke="#a34d12" stroke-width="3"/>
  <rect x="1170" y="420" width="92" height="55" fill="#7db2ca" opacity=".8"/>

  <!-- right chairs -->
  <g fill="#25282b" stroke="#111" stroke-width="4">
    <ellipse cx="1085" cy="430" rx="45" ry="58" transform="rotate(12 1085 430)"/>
    <ellipse cx="1080" cy="690" rx="45" ry="58" transform="rotate(10 1080 690)"/>
  </g>

  <!-- clean open floor emphasis -->
  <rect x="500" y="255" width="520" height="610" rx="22" fill="none" stroke="#ffffff" stroke-width="2" opacity=".10"/>
</svg>
