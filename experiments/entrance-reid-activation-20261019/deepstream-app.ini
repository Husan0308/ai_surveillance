[application]
enable-perf-measurement=1
perf-measurement-interval-sec=5
reid-track-output-dir=/outputs/reid-features

[tiled-display]
enable=0
rows=1
columns=2
width=1920
height=1080
gpu-id=0
nvbuf-memory-type=0

[source0]
enable=1
type=3
uri=file:///inputs/cam_00.mp4
num-sources=1
gpu-id=0
cudadec-memtype=0

[source1]
enable=1
type=3
uri=file:///inputs/cam_01.mp4
num-sources=1
gpu-id=0
cudadec-memtype=0

[sink0]
enable=1
type=1
sync=0
gpu-id=0

[streammux]
gpu-id=0
live-source=0
batch-size=2
batched-push-timeout=33000
width=1920
height=1080
enable-padding=0
nvbuf-memory-type=0

[primary-gie]
enable=1
gpu-id=0
batch-size=2
interval=0
gie-unique-id=1
config-file=/config/config-infer-primary.ini

[tracker]
enable=1
tracker-width=960
tracker-height=544
ll-lib-file=/opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
ll-config-file=/config/config-tracker-nvdcf-reid.yml
gpu-id=0
display-tracking-id=1

[osd]
enable=0

[tests]
file-loop=0
